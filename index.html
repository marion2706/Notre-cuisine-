
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#596344">
<title>Notre Cuisine</title>
<style>
:root{--green:#596344;--light:#eef0e7;--cream:#faf7ef;--brown:#806d52}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#34382d}
header{background:var(--green);color:white;padding:25px 20px;border-radius:0 0 25px 25px}
header h1{margin:0;font-family:Georgia,serif;font-size:29px}
header p{margin:7px 0 0;color:#e5e8db}
main{padding:18px;max-width:650px;margin:auto}
h2{font-family:Georgia,serif;color:var(--green)}
.card{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #0000000b}
button{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 15px;font-size:15px;margin:5px 3px;cursor:pointer}
button.light{background:var(--light);color:var(--green)}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:16px}
nav{position:sticky;bottom:0;background:var(--cream);display:flex;overflow-x:auto;padding:9px 4px;border-top:1px solid #ddd}
nav button{font-size:12px;min-width:85px;padding:10px 6px;margin:2px}
.item{padding:10px 0;border-bottom:1px solid #eee}
.small{color:#777;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🌿 Notre Cuisine</h1>
<p>La cuisine de toute la famille</p>
</header>
<main id="app"></main>
<nav>
<button onclick="page('home')">🏡 Accueil</button>
<button onclick="page('stock')">🥕 Inventaire</button>
<button onclick="page('shopping')">🛒 Courses</button>
<button onclick="page('recipes')">🍲 Recettes</button>
<button onclick="page('planning')">📅 Planning</button>
<button onclick="page('alerts')">🔔 Alertes</button>
<button onclick="page('settings')">⚙️ Réglages</button>
</nav>
<script>
const get=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let stock=get('stock',[]), shopping=get('shopping',[]), recipes=get('recipes',[]), plans=get('plans',{});
function page(p){
const app=document.getElementById('app');
if(p==='home'){
app.innerHTML=`<h2>Que mange-t-on aujourd'hui ?</h2>
<div class="card"><h3>☀️ Déjeuner</h3><p>${plans.lunch||'Aucun repas prévu'}</p></div>
<div class="card"><h3>🌙 Dîner</h3><p>${plans.dinner||'Aucun repas prévu'}</p></div>
<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Découvrons une recette déjà enregistrée !</p><button onclick="randomRecipe()">Trouver une idée</button><p id="random"></p></div>
<div class="card"><h3>🌿 Notre cuisine</h3><p>${stock.length} produit(s) dans l'inventaire</p><p>${shopping.length} article(s) dans la liste de courses</p><p>${recipes.length} recette(s) enregistrée(s)</p></div>`;
}
if(p==='stock'){
app.innerHTML=`<h2>🥕 Inventaire</h2><div class="card"><h3>Ajouter un produit</h3>
<label>Nom du produit</label><input id="product" placeholder="Ex : Lait">
<label>Emplacement</label><select id="place"><option>Réfrigérateur</option><option>Congélateur</option><option>Placard</option></select>
<label>Quantité</label><input id="quantity" placeholder="Ex : 2 bouteilles">
<label>Date limite (facultatif)</label><input id="expiry" type="date">
<button onclick="addStock()">Ajouter à l'inventaire</button></div>
<div class="card"><h3>Mes produits</h3>${stock.map((x,i)=>`<div class="item"><b>${x.name}</b> — ${x.quantity}<br><span class="small">${x.place} ${x.expiry?'· Date : '+x.expiry:''}</span><button class="light" onclick="removeStock(${i})">Supprimer</button></div>`).join('')||'Ton inventaire est vide pour le moment.'}</div>`;
}
if(p==='shopping'){
app.innerHTML=`<h2>🛒 Liste de courses</h2><div class="card"><input id="buy" placeholder="Ajouter un article"><button onclick="addBuy()">Ajouter</button></div><div class="card">${shopping.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" onchange="checkBuy(${i})" ${x.done?'checked':''}> ${x.name}</label></div>`).join('')||'Aucun article pour le moment.'}</div>`;
}
if(p==='recipes'){
app.innerHTML=`<h2>🍲 Nos recettes</h2><div class="card"><h3>Ajouter une recette</h3><input id="rname" placeholder="Nom de la recette"><select id="category"><option>Entrée</option><option>Plat</option><option>Dessert</option><option>Apéritif</option></select><textarea id="ingredients" placeholder="Ingrédients nécessaires" style="width:100%;height:80px;padding:10px;border-radius:10px"></textarea><button onclick="addRecipe()">Enregistrer la recette</button></div><div class="card"><h3>Recettes enregistrées</h3>${recipes.map(x=>`<div class="item"><b>${x.name}</b><br><span class="small">${x.category} · ${x.ingredients}</span></div>`).join('')||'Ajoutons ensemble tes premières recettes !'}</div>`;
}
if(p==='planning'){
app.innerHTML=`<h2>📅 Planning des repas</h2><div class="card"><label>Déjeuner</label><input id="lunch" value="${plans.lunch||''}" placeholder="Repas du midi"><label>Dîner</label><input id="dinner" value="${plans.dinner||''}" placeholder="Repas du soir"><button onclick="savePlans()">Enregistrer la journée</button></div>`;
}
if(p==='alerts'){
app.innerHTML=`<h2>🔔 Alertes</h2><div class="card"><p>Les produits proches de leur date limite :</p>${stock.filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+3*86400000).toISOString().slice(0,10)).map(x=>`<p>⚠️ ${x.name} — ${x.expiry}</p>`).join('')||'Aucune alerte pour le moment.'}<p class="small">Les notifications automatiques seront ajoutées dans une prochaine étape.</p></div>`;
}
if(p==='settings'){
app.innerHTML=`<h2>⚙️ Paramètres</h2><div class="card"><p>🌿 Notre Cuisine</p><p class="small">Application familiale en construction.</p><p>Les données de cette première version sont enregistrées sur cet appareil uniquement.</p></div>`;
}
}
function addStock(){let name=document.getElementById('product').value.trim();if(!name)return;stock.push({name,place:document.getElementById('place').value,quantity:document.getElementById('quantity').value,expiry:document.getElementById('expiry').value});save('stock',stock);page('stock')}
function removeStock(i){stock.splice(i,1);save('stock',stock);page('stock')}
function addBuy(){let name=document.getElementById('buy').value.trim();if(!name)return;shopping.push({name,done:false});save('shopping',shopping);page('shopping')}
function checkBuy(i){shopping[i].done=!shopping[i].done;save('shopping',shopping);page('shopping')}
function addRecipe(){let name=document.getElementById('rname').value.trim();if(!name)return;recipes.push({name,category:document.getElementById('category').value,ingredients:document.getElementById('ingredients').value});save('recipes',recipes);page('recipes')}
function savePlans(){plans={lunch:document.getElementById('lunch').value,dinner:document.getElementById('dinner').value};save('plans',plans);page('planning')}
function randomRecipe(){let r=recipes.length?recipes[Math.floor(Math.random()*recipes.length)].name:'Ajoute d’abord quelques recettes !';document.getElementById('random').textContent=r}
page('home');
</script>
</body>
</html>
