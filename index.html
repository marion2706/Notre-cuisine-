
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#596344">
<title>Notre Cuisine</title>
<style>
:root{--green:#596344;--light:#eef0e7;--cream:#faf7ef;--brown:#806d52}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#34382d}
header{background:var(--green);color:white;padding:25px 20px;border-radius:0 0 25px 25px}
header h1{margin:0;font-family:Georgia,serif;font-size:29px}
header p{margin:7px 0 0;color:#e5e8db}
main{padding:18px;max-width:700px;margin:auto;padding-bottom:30px}
h2,h3{font-family:Georgia,serif;color:var(--green)}
.card{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #0000000b}
button{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 15px;font-size:15px;margin:5px 3px;cursor:pointer}
button.light{background:var(--light);color:var(--green)}
button.active{background:#343d2a}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:16px;background:white;color:#34382d}
textarea{min-height:85px}
label{font-size:14px;font-weight:600}
nav{position:sticky;bottom:0;background:var(--cream);display:flex;overflow-x:auto;padding:9px 4px;border-top:1px solid #ddd;z-index:5}
nav button{font-size:12px;min-width:85px;padding:10px 6px;margin:2px}
.item{padding:12px 0;border-bottom:1px solid #eee}
.small{color:#777;font-size:13px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:12px 0}
.tabs button{white-space:nowrap;flex:1}
.empty{color:#888;font-style:italic;padding:12px 0}
a{color:var(--green);overflow-wrap:anywhere}
.pill{display:inline-block;background:var(--light);color:var(--green);padding:5px 9px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🌿 Notre Cuisine</h1>
<p>La cuisine de toute la famille</p>
</header>
<main id="app"></main>
<nav>
<button onclick="page('home')">🏡 Accueil</button>
<button onclick="page('stock')">🥕 Inventaire</button>
<button onclick="page('shopping')">🛒 Courses</button>
<button onclick="page('recipes')">🍲 Recettes</button>
<button onclick="page('planning')">📅 Planning</button>
<button onclick="page('alerts')">🔔 Alertes</button>
<button onclick="page('settings')">⚙️ Réglages</button>
</nav>
<script>
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stock=get('stock',[]),shopping=get('shopping',[]),recipes=get('recipes',[]),plans=get('plans',{});
let stockPlace='Placard',stockSearch='';
const places=['Placard','Réfrigérateur','Congélateur'];
const categories=['Entrée','Plat','Dessert','Apéritif'];

function page(p){
const app=document.getElementById('app');
if(p==='home'){
const todayPlan=getDayPlan(todayKey());
const lunchToday=todayPlan.lunch?.name||'Aucun repas prévu';
const dinnerToday=todayPlan.dinner?.name||'Aucun repas prévu';
app.innerHTML=`<h2>Que mange-t-on aujourd'hui ?</h2>
<div class="card"><h3>☀️ Déjeuner</h3><p>${esc(lunchToday)}</p></div>
<div class="card"><h3>🌙 Dîner</h3><p>${esc(dinnerToday)}</p></div>
<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Découvrons une recette déjà enregistrée !</p><button onclick="randomRecipe()">Trouver une idée</button><p id="random"></p></div>
<div class="card"><h3>🌿 Notre cuisine</h3><p>${stock.length} produit(s) en stock</p><p>${shopping.length} article(s) dans les courses</p><p>${recipes.length} recette(s) enregistrée(s)</p></div>`;
}
if(p==='stock'){renderStock()}
if(p==='shopping'){
app.innerHTML=`<h2>🛒 Liste de courses</h2>
<div class="card"><h3>Ajouter un article</h3><input id="buy" placeholder="Ex : Pain, lait, œufs"><button onclick="addBuy()">Ajouter</button></div>
<div class="card"><h3>Ma liste</h3>${shopping.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" onchange="checkBuy(${i})" ${x.done?'checked':''}> ${esc(x.name)}</label><button class="light" onclick="removeBuy(${i})">Supprimer</button></div>`).join('')||'<p class="empty">Aucun article pour le moment.</p>'}</div>`;
}
if(p==='recipes'){renderRecipes()}
if(p==='planning'){renderPlanning()}

if(p==='alerts'){
const soon=new Date(Date.now()+3*86400000).toISOString().slice(0,10);
app.innerHTML=`<h2>🔔 Alertes</h2><div class="card"><h3>Produits proches de leur date</h3>${stock.filter(x=>x.expiry&&x.expiry<=soon).map(x=>`<p>⚠️ ${esc(x.name)} — ${esc(x.expiry)}</p>`).join('')||'<p class="empty">Aucune alerte pour le moment.</p>'}<p class="small">Les notifications automatiques seront ajoutées ultérieurement.</p></div>`;
}
if(p==='settings'){
app.innerHTML=`<h2>⚙️ Paramètres</h2><div class="card"><p>🌿 Notre Cuisine</p><p>Application familiale en construction.</p><p class="small">Cette version enregistre les données dans le navigateur utilisé. Elles ne sont pas encore partagées entre vos appareils.</p></div>`;
}
}

function renderStock(){
const app=document.getElementById('app');
const shown=stock.filter(x=>(x.place||'Réfrigérateur')===stockPlace&&x.name.toLowerCase().includes(stockSearch.toLowerCase()));
app.innerHTML=`<h2>🥕 Mon inventaire</h2>
<div class="tabs">${places.map(x=>`<button class="${stockPlace===x?'active':''}" onclick="stockPlace='${x}';renderStock()">${x==='Placard'?'🥫':x==='Réfrigérateur'?'🥛':'❄️'} ${x}</button>`).join('')}</div>
<div class="card"><h3>Ajouter un aliment</h3>
<label>Nom du produit</label><input id="product" placeholder="Ex : Pâtes, lait, poulet...">
<label>Quantité restante</label><input id="quantity" placeholder="Ex : 2 paquets, 500 g">
<label>Date limite (facultatif)</label><input id="expiry" type="date">
<button onclick="addStock()">Ajouter dans ${stockPlace.toLowerCase()}</button></div>
<div class="card"><h3>🔎 Rechercher un produit</h3><input value="${esc(stockSearch)}" placeholder="Rechercher un aliment..." oninput="stockSearch=this.value;renderStockKeepFocus(this.value)" id="stockSearch">
<h3>${stockPlace}</h3>
${shown.map(x=>{let i=stock.indexOf(x);return `<div class="item"><b>${esc(x.name)}</b><br><span class="small">${esc(x.quantity||'Quantité non précisée')} ${x.expiry?'· Date : '+esc(x.expiry):''}</span>
<label class="small">Déplacer vers :</label><select onchange="moveStock(${i},this.value)">${places.map(pl=>`<option ${pl===(x.place||'Réfrigérateur')?'selected':''}>${pl}</option>`).join('')}</select>
<button class="light" onclick="removeStock(${i})">Supprimer</button></div>`}).join('')||'<p class="empty">Aucun produit dans cet espace.</p>'}</div>`;
}
function renderStockKeepFocus(value){
let el=document.getElementById('stockSearch');let pos=el.selectionStart;renderStock();let next=document.getElementById('stockSearch');next.focus();next.setSelectionRange(pos,pos);
}
function addStock(){
let name=document.getElementById('product').value.trim();if(!name)return;
stock.push({name,place:stockPlace,quantity:document.getElementById('quantity').value,expiry:document.getElementById('expiry').value});
save('stock',stock);stockSearch='';renderStock();
}
function removeStock(i){stock.splice(i,1);save('stock',stock);renderStock()}
function moveStock(i,place){stock[i].place=place;save('stock',stock);renderStock()}
function addBuy(){let name=document.getElementById('buy').value.trim();if(!name)return;shopping.push({name,done:false});save('shopping',shopping);page('shopping')}
function removeBuy(i){shopping.splice(i,1);save('shopping',shopping);page('shopping')}
function checkBuy(i){shopping[i].done=!shopping[i].done;save('shopping',shopping);page('shopping')}
function renderRecipes(){
const app=document.getElementById('app');
app.innerHTML=`<h2>🍲 Nos recettes</h2>
<div class="card"><h3>🌐 Ajouter depuis Internet</h3>
<p class="small">Colle le lien d'une recette Marmiton ou d'un autre site. Ouvre-la pour consulter les ingrédients, puis complète la fiche ci-dessous.</p>
<label>Lien de la recette</label><input id="recipeUrl" type="url" placeholder="https://www.marmiton.org/...">
<button class="light" onclick="openRecipeLink()">Ouvrir le lien</button>
<h3>Enregistrer la recette</h3>
<label>Nom de la recette</label><input id="rname" placeholder="Ex : Welsh traditionnel">
<label>Catégorie</label><select id="category">${categories.map(x=>`<option>${x}</option>`).join('')}</select>
<label>Ingrédients</label><textarea id="ingredients" placeholder="Un ingrédient par ligne"></textarea>
<label>Préparation</label><textarea id="preparation" placeholder="Décris les étapes de préparation"></textarea>
<label>Nombre de personnes</label><input id="servings" type="number" min="1" value="3">
<button onclick="addRecipe()">Enregistrer dans mes recettes</button></div>
<div class="card"><h3>📖 Ma bibliothèque</h3>
${recipes.map((x,i)=>`<div class="item"><b>${esc(x.name)}</b> <span class="pill">${esc(x.category)}</span>
<p class="small">${esc(x.ingredients||'Ingrédients non renseignés')}</p>
${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Voir la recette originale</a>`:''}
${x.preparation?`<details><summary>Voir la préparation</summary><p>${esc(x.preparation)}</p></details>`:''}
<button class="light" onclick="deleteRecipe(${i})">Supprimer</button></div>`).join('')||'<p class="empty">Aucune recette enregistrée pour le moment.</p>'}</div>`;
}
function openRecipeLink(){
let url=document.getElementById('recipeUrl').value.trim();
if(!url)return alert('Ajoute d’abord le lien de la recette.');
try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();window.open(u.href,'_blank','noopener')}catch(e){alert('Vérifie que le lien commence par https://')}
}
function addRecipe(){
let name=document.getElementById('rname').value.trim();if(!name)return alert('Ajoute le nom de la recette.');
let url=document.getElementById('recipeUrl').value.trim();
if(url){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();url=u.href}catch(e){return alert('Le lien de la recette ne semble pas valide.')}}
recipes.push({name,category:document.getElementById('category').value,ingredients:document.getElementById('ingredients').value,preparation:document.getElementById('preparation').value,servings:document.getElementById('servings').value,url});
save('recipes',recipes);page('recipes');
}
function deleteRecipe(i){recipes.splice(i,1);save('recipes',recipes);page('recipes')}
// Planning hebdomadaire : chaque repas est associé à une date et à une recette.
let planningWeekOffset=0;
function dateKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function getDayPlan(key){return plans[key]||{lunch:null,dinner:null}}
function weekStart(offset=0){
 const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d;
}
function formatDay(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function renderPlanning(){
 const app=document.getElementById('app');const start=weekStart(planningWeekOffset);
 const end=new Date(start);end.setDate(end.getDate()+6);
 const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
 app.innerHTML=`<h2>📅 Planning de la semaine</h2>
 <div class="card">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
 <button class="light" onclick="changePlanningWeek(-1)">← Semaine précédente</button>
 <b>${start.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</b>
 <button class="light" onclick="changePlanningWeek(1)">Semaine suivante →</button>
 </div><button class="light" onclick="planningWeekOffset=0;renderPlanning()">Aujourd'hui</button>
 <p class="small">Choisis une recette enregistrée ou saisis un repas libre. Les portions sont réglées à 3 personnes par défaut.</p>
 </div>
 ${days.map(d=>{const key=dateKey(d);const day=getDayPlan(key);return `
 <div class="card">
 <h3 style="text-transform:capitalize">${formatDay(d)}</h3>
 ${renderMealEditor(key,'lunch','☀️ Déjeuner',day.lunch)}
 ${renderMealEditor(key,'dinner','🌙 Dîner',day.dinner)}
 </div>`}).join('')}
 <div class="card"><h3>🛒 Courses de la semaine</h3>
 <p class="small">Les ingrédients des recettes prévues sont regroupés ici. Tu peux les ajouter à ta liste de courses.</p>
 <div id="weeklyIngredients">${weeklyIngredientsHtml(start)}</div>
 <button onclick="addWeeklyIngredients()">Ajouter les ingrédients à ma liste de courses</button>
 </div>`;
}
function renderMealEditor(key,slot,label,meal){
 const recipeOptions=recipes.map((r,i)=>`<option value="${i}" ${meal?.recipeIndex===i?'selected':''}>${esc(r.name)}</option>`).join('');
 const custom=meal?.custom||(!meal?.recipeIndex&&meal?.name&&!recipes.some(r=>r.name===meal.name));
 return `<div class="item"><b>${label}</b>
 <label>Recette enregistrée</label>
 <select id="${key}-${slot}-recipe" onchange="selectPlannedRecipe('${key}','${slot}',this.value)">
 <option value="">Choisir une recette…</option>${recipeOptions}<option value="custom" ${custom?'selected':''}>Autre repas / saisie libre</option>
 </select>
 <div id="${key}-${slot}-custom" ${custom?'':'hidden'}>
 <label>Nom du repas</label><input id="${key}-${slot}-name" value="${esc(custom?meal?.name||'':'')}" placeholder="Ex : Salade composée">
 </div>
 <label>Nombre de personnes</label>
 <input id="${key}-${slot}-servings" type="number" min="1" max="20" value="${meal?.servings||3}">
 <button onclick="savePlannedMeal('${key}','${slot}')">Enregistrer</button>
 ${meal?'<button class="light" onclick="clearPlannedMeal(\''+key+'\',\''+slot+'\')">Supprimer ce repas</button>':''}
 </div>`;
}
function changePlanningWeek(delta){planningWeekOffset+=delta;renderPlanning()}
function selectPlannedRecipe(key,slot,value){
 const custom=document.getElementById(key+'-'+slot+'-custom');
 if(custom)custom.hidden=value!=='custom';
 if(value!=='custom'&&value!==''){
  const recipe=recipes[Number(value)];
  const servings=document.getElementById(key+'-'+slot+'-servings');
  if(servings&&recipe?.servings)servings.value=3;
 }
}
function savePlannedMeal(key,slot){
 const select=document.getElementById(key+'-'+slot+'-recipe');
 const servings=Math.max(1,Number(document.getElementById(key+'-'+slot+'-servings').value)||3);
 let meal=null;
 if(select.value==='custom'){
  const name=document.getElementById(key+'-'+slot+'-name').value.trim();
  if(!name)return alert('Indique le nom du repas.');
  meal={name,custom:true,servings};
 }else if(select.value!==''){
  const index=Number(select.value);const recipe=recipes[index];
  if(!recipe)return alert('Cette recette n’existe plus.');
  meal={name:recipe.name,recipeIndex:index,ingredients:recipe.ingredients||'',recipeServings:Number(recipe.servings)||3,servings};
 }else{
  return alert('Choisis une recette ou sélectionne « Autre repas ».');
 }
 if(!plans[key]||!plans[key].lunch&&!plans[key].dinner)plans[key]={lunch:null,dinner:null};
 plans[key][slot]=meal;save('plans',plans);renderPlanning();
}
function clearPlannedMeal(key,slot){if(plans[key]){plans[key][slot]=null;save('plans',plans)}renderPlanning()}
function weeklyMeals(start){
 const out=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const day=getDayPlan(dateKey(d));['lunch','dinner'].forEach(slot=>{if(day[slot]?.ingredients)out.push({name:day[slot].name,ingredients:day[slot].ingredients,servings:day[slot].servings||3,recipeServings:day[slot].recipeServings||3})})}return out;
}
function weeklyIngredientLines(start){
 const lines=[];weeklyMeals(start).forEach(meal=>meal.ingredients.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).forEach(item=>lines.push(item)));
 return [...new Set(lines)];
}
function weeklyIngredientsHtml(start){
 const lines=weeklyIngredientLines(start);return lines.length?'<ul>'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">Ajoute des recettes au planning pour voir les ingrédients nécessaires.</p>';
}
function addWeeklyIngredients(){
 const lines=weeklyIngredientLines(weekStart(planningWeekOffset));let added=0;
 lines.forEach(name=>{if(!shopping.some(x=>x.name.toLowerCase()===name.toLowerCase()&&!x.done)){shopping.push({name,done:false});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) ajouté(s) à la liste de courses.');page('shopping');
}
function randomRecipe(){let r=recipes.length?recipes[Math.floor(Math.random()*recipes.length)].name:'Ajoute d’abord quelques recettes !';document.getElementById('random').textContent=r}
page('home');
</script>
</body>
</html>
