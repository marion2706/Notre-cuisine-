
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#596344">
<link rel="icon" type="image/png" sizes="512x512" href="./icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=3">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notre Cuisine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Notre Cuisine</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#596344;--light:#eef0e7;--cream:#faf7ef;--brown:#806d52}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#34382d}
header{background:var(--green);color:white;padding:25px 20px;border-radius:0 0 25px 25px}
header h1{margin:0;font-family:Georgia,serif;font-size:29px}
header p{margin:7px 0 0;color:#e5e8db}
main{padding:18px;max-width:700px;margin:auto;padding-bottom:30px}
h2,h3{font-family:Georgia,serif;color:var(--green)}
.card{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #0000000b}
button{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 15px;font-size:15px;margin:5px 3px;cursor:pointer}
button.light{background:var(--light);color:var(--green)}
button.active{background:#343d2a}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;font-size:16px;background:white;color:#34382d}
textarea{min-height:85px}
label{font-size:14px;font-weight:600}
nav{position:sticky;bottom:0;background:var(--cream);display:flex;overflow-x:auto;padding:9px 4px;border-top:1px solid #ddd;z-index:5}
nav button{font-size:12px;min-width:85px;padding:10px 6px;margin:2px}
.item{padding:12px 0;border-bottom:1px solid #eee}
.small{color:#777;font-size:13px}
.tabs{display:flex;gap:5px;overflow-x:auto;margin:12px 0}
.tabs button{white-space:nowrap;flex:1}
.empty{color:#888;font-style:italic;padding:12px 0}
a{color:var(--green);overflow-wrap:anywhere}
.pill{display:inline-block;background:var(--light);color:var(--green);padding:5px 9px;border-radius:20px;font-size:12px}
#auth-screen{display:none;min-height:75vh;align-items:center;justify-content:center;padding:20px}
body:not(.connected) #auth-screen{display:flex}
body:not(.connected) main,body:not(.connected) nav{display:none}
.auth-card{background:white;border-radius:18px;padding:22px;width:100%;max-width:430px;box-shadow:0 5px 20px #00000012}
.auth-card h2{margin-top:0}
#auth-message{min-height:20px}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:13px">
<img src="./icon.png?v=3" alt="" width="64" height="64" style="border-radius:16px;background:#faf7ef;flex:none">
<div><h1>Notre Cuisine</h1>
<p>La cuisine de toute la famille</p></div>
</div>
</header>

<div id="auth-screen">
  <div class="auth-card">
    <h2>🌿 Bienvenue dans Notre Cuisine</h2>
    <p>Connecte-toi pour retrouver votre cuisine partagée sur vos deux téléphones.</p>
    <label>Adresse e-mail</label>
    <input id="auth-email" type="email" autocomplete="email" placeholder="tonadresse@email.com">
    <label>Mot de passe</label>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="Ton mot de passe">
    <button id="auth-login" onclick="loginToApp()">Se connecter</button>
    <p id="auth-message" class="small" role="status"></p>
  </div>
</div>
<main id="app"></main>
<nav>
<button onclick="page('home')">🏡 Accueil</button>
<button onclick="page('stock')">🥕 Inventaire</button>
<button onclick="page('shopping')">🛒 Courses</button>
<button onclick="page('recipes')">🍲 Recettes</button>
<button onclick="page('planning')">📅 Planning</button>
<button onclick="page('alerts')">🔔 Alertes</button>
<button onclick="page('settings')">⚙️ Réglages</button>
</nav>
<script>
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
function save(k,v){localStorage.setItem(k,JSON.stringify(v));if(window.cloudReady)scheduleCloudSave();}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let stock=get('stock',[]),shopping=get('shopping',[]),recipes=get('recipes',[]),plans=get('plans',{});
let stockPlace='Placard',stockSearch='';
const places=['Placard','Réfrigérateur','Congélateur'];
const categories=['Entrée','Plat','Dessert','Biscuits maison','Apéritif'];
const regions=["Nord","Alsace","Provence","Bretagne","Lyonnais","Pays basque"];
let recipeRegionFilter='Toutes';
let recipeCategoryFilter='Toutes';

function page(p){
const app=document.getElementById('app');
if(p==='home'){
const todayPlan=getDayPlan(todayKey());
const lunchToday=todayPlan.lunch?.name||'Aucun repas prévu';
const dinnerToday=todayPlan.dinner?.name||'Aucun repas prévu';
app.innerHTML=`<h2>Que mange-t-on aujourd'hui ?</h2>
<div class="card"><h3>☀️ Déjeuner</h3><p>${esc(lunchToday)}</p></div>
<div class="card"><h3>🌙 Dîner</h3><p>${esc(dinnerToday)}</p></div>
<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Découvrons une recette déjà enregistrée !</p><button onclick="randomRecipe()">Trouver une idée</button><p id="random"></p></div>
<div class="card"><h3>🌿 Notre cuisine</h3><p>${stock.length} produit(s) en stock</p><p>${shopping.length} article(s) dans les courses</p><p>${recipes.length} recette(s) enregistrée(s)</p></div>`;
}
if(p==='stock'){renderStock()}
if(p==='shopping'){
app.innerHTML=`<h2>🛒 Liste de courses</h2>
<div class="card"><h3>Ajouter un article</h3><input id="buy" placeholder="Ex : Pain, lait, œufs"><button onclick="addBuy()">Ajouter</button></div>
<div class="card"><h3>Ma liste</h3>${shopping.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" onchange="checkBuy(${i})" ${x.done?'checked':''}> ${esc(x.name)}</label><button class="light" onclick="removeBuy(${i})">Supprimer</button></div>`).join('')||'<p class="empty">Aucun article pour le moment.</p>'}</div>`;
}
if(p==='recipes'){renderRecipes()}
if(p==='planning'){renderPlanning()}

if(p==='alerts'){
const soon=new Date(Date.now()+3*86400000).toISOString().slice(0,10);
app.innerHTML=`<h2>🔔 Alertes</h2><div class="card"><h3>Produits proches de leur date</h3>${stock.filter(x=>x.expiry&&x.expiry<=soon).map(x=>`<p>⚠️ ${esc(x.name)} — ${esc(x.expiry)}</p>`).join('')||'<p class="empty">Aucune alerte pour le moment.</p>'}<p class="small">Les notifications automatiques seront ajoutées ultérieurement.</p></div>`;
}
if(p==='settings'){
app.innerHTML=`<h2>⚙️ Paramètres</h2><div class="card"><p>🌿 Notre Cuisine</p><p>Application familiale en construction.</p><p class="small">Cette version enregistre les données dans le navigateur utilisé. Elles ne sont pas encore partagées entre vos appareils.</p></div>`;
}
}

function renderStock(){
const app=document.getElementById('app');
const shown=stock.filter(x=>(x.place||'Réfrigérateur')===stockPlace&&x.name.toLowerCase().includes(stockSearch.toLowerCase()));
app.innerHTML=`<h2>🥕 Mon inventaire</h2>
<div class="tabs">${places.map(x=>`<button class="${stockPlace===x?'active':''}" onclick="stockPlace='${x}';renderStock()">${x==='Placard'?'🥫':x==='Réfrigérateur'?'🥛':'❄️'} ${x}</button>`).join('')}</div>
<div class="card"><h3>Ajouter un aliment</h3>
<label>Nom du produit</label><input id="product" placeholder="Ex : Pâtes, lait, poulet...">
<label>Quantité restante</label><input id="quantity" placeholder="Ex : 2 paquets, 500 g">
<label>Date limite (facultatif)</label><input id="expiry" type="date">
<button onclick="addStock()">Ajouter dans ${stockPlace.toLowerCase()}</button></div>
<div class="card"><h3>🔎 Rechercher un produit</h3><input value="${esc(stockSearch)}" placeholder="Rechercher un aliment..." oninput="stockSearch=this.value;renderStockKeepFocus(this.value)" id="stockSearch">
<h3>${stockPlace}</h3>
${shown.map(x=>{let i=stock.indexOf(x);return `<div class="item"><b>${esc(x.name)}</b><br><span class="small">${esc(x.quantity||'Quantité non précisée')} ${x.expiry?'· Date : '+esc(x.expiry):''}</span>
<label class="small">Déplacer vers :</label><select onchange="moveStock(${i},this.value)">${places.map(pl=>`<option ${pl===(x.place||'Réfrigérateur')?'selected':''}>${pl}</option>`).join('')}</select>
<button class="light" onclick="removeStock(${i})">Supprimer</button></div>`}).join('')||'<p class="empty">Aucun produit dans cet espace.</p>'}</div>`;
}
function renderStockKeepFocus(value){
let el=document.getElementById('stockSearch');let pos=el.selectionStart;renderStock();let next=document.getElementById('stockSearch');next.focus();next.setSelectionRange(pos,pos);
}
function addStock(){
let name=document.getElementById('product').value.trim();if(!name)return;
stock.push({name,place:stockPlace,quantity:document.getElementById('quantity').value,expiry:document.getElementById('expiry').value});
save('stock',stock);stockSearch='';renderStock();
}
function removeStock(i){stock.splice(i,1);save('stock',stock);renderStock()}
function moveStock(i,place){stock[i].place=place;save('stock',stock);renderStock()}
function addBuy(){let name=document.getElementById('buy').value.trim();if(!name)return;shopping.push({name,done:false});save('shopping',shopping);page('shopping')}
function removeBuy(i){shopping.splice(i,1);save('shopping',shopping);page('shopping')}
function checkBuy(i){shopping[i].done=!shopping[i].done;save('shopping',shopping);page('shopping')}
const regionalRecipeData=[["Nord","Plat","Welsh traditionnel","pain de campagne;cheddar;jambon;bière blonde;moutarde;œufs","Faire griller le pain avec le jambon. Faire fondre le cheddar avec bière et moutarde. Napper le pain et gratiner, puis ajouter un œuf au plat."],["Nord","Plat","Carbonnade flamande","bœuf à braiser;oignons;bière brune;pain d’épices;moutarde;vergeoise","Faire dorer le bœuf et les oignons. Ajouter la bière. Poser le pain d’épices tartiné de moutarde et laisser mijoter à couvert environ 2 h 30."],["Nord","Plat","Potjevleesch","poulet;veau;lapin;carottes;oignons;bière blonde;vinaigre de cidre;gélatine","Déposer les viandes et légumes dans une terrine. Couvrir de bière et de vinaigre, puis cuire doucement. Filtrer le jus, ajouter la gélatine selon son mode d’emploi et laisser prendre au frais."],["Nord","Plat","Tarte au maroilles","pâte brisée;maroilles;crème;œufs;lait;poivre","Foncer un moule avec la pâte. Mélanger œufs, crème et lait. Ajouter le maroilles en tranches et cuire environ 30 min à 190 °C."],["Nord","Plat","Endives au jambon","endives;jambon;beurre;farine;lait;gruyère râpé","Cuire les endives et bien les égoutter. Préparer une béchamel. Enrouler les endives dans le jambon, napper de béchamel et gratiner."],["Nord","Plat","Waterzooi de poulet","poulet;carottes;poireaux;cèleri;crème;jaune d’œuf;bouillon de volaille","Cuire le poulet et les légumes dans le bouillon. Retirer le poulet. Lier le bouillon avec crème et jaune d’œuf hors du feu, puis remettre le poulet."],["Nord","Plat","Ficelles picardes","crêpes salées;champignons;jambon;crème;échalote;gruyère","Faire revenir échalote et champignons. Garnir les crêpes de jambon et de champignons, puis rouler. Napper de crème, ajouter le fromage et gratiner."],["Nord","Plat","Flamiche aux poireaux","pâte feuilletée;poireaux;crème;œufs;beurre","Faire fondre les poireaux émincés dans le beurre. Mélanger crème et œufs puis ajouter les poireaux. Verser sur la pâte et cuire 30 min à 180 °C."],["Nord","Dessert","Gaufres lilloises","farine;œufs;beurre;lait;sucre;levure boulangère","Délayer la levure dans le lait tiède. Ajouter farine, œufs, sucre et beurre. Pétrir, laisser lever, former des boules et cuire au gaufrier."],["Nord","Dessert","Merveilleux au chocolat","blancs d’œufs;sucre;crème entière;chocolat noir;copeaux de chocolat","Monter les blancs avec le sucre et cuire les meringues 1 h 30 à 100 °C. Monter la crème en chantilly, incorporer le chocolat fondu refroidi et assembler avec les meringues."],["Alsace","Plat","Flammekueche","pâte fine;fromage blanc;crème;oignons;lardons","Mélanger fromage blanc et crème. Étaler sur la pâte, ajouter oignons émincés et lardons. Cuire 8 à 10 min dans un four très chaud."],["Alsace","Plat","Baeckeoffe","bœuf;porc;agneau;pommes de terre;carottes;oignons;vin blanc;thym","Faire mariner les viandes en cubes avec vin blanc, oignons et aromates une nuit. Alterner légumes et viandes dans une terrine, verser la marinade et cuire 3 h à 160 °C."],["Alsace","Plat","Choucroute garnie","choucroute cuite;saucisses de Strasbourg;saucisse fumée;poitrine demi-sel;pommes de terre;vin blanc;baies de genièvre","Faire revenir un oignon, ajouter choucroute, vin blanc et genièvre. Cuire doucement 45 min. Ajouter les viandes et servir avec les pommes de terre vapeur."],["Alsace","Plat","Spaetzle maison","farine;œufs;lait;beurre;sel","Mélanger farine, œufs, lait et sel pour obtenir une pâte épaisse. Faire tomber des morceaux dans l’eau bouillante salée. Égoutter lorsqu’ils remontent et faire dorer au beurre."],["Alsace","Plat","Fleischnacka","farine;œufs;eau;bœuf haché cuit;oignon;carotte;bouillon","Pétrir farine, œufs et eau puis étaler. Répartir la viande et les légumes hachés, rouler et couper en tranches. Faire dorer puis mijoter dans le bouillon."],["Alsace","Dessert","Kougelhopf","farine;œufs;lait;sucre;beurre;levure boulangère;raisins secs;amandes","Préparer une pâte levée avec farine, lait, œufs, sucre et beurre. Ajouter les raisins, laisser lever, placer les amandes dans le moule puis cuire environ 40 min à 180 °C."],["Alsace","Biscuits maison","Bredele au beurre","farine;beurre;sucre;œuf;sucre vanillé","Mélanger beurre et sucres puis ajouter l’œuf et la farine. Laisser reposer au frais. Étaler, découper des formes et cuire 10 à 12 min à 180 °C."],["Alsace","Dessert","Tarte au fromage blanc","pâte brisée;fromage blanc;œufs;sucre;crème;farine;citron","Foncer un moule avec la pâte. Mélanger fromage blanc, jaunes, sucre, crème, farine et zeste de citron, puis incorporer les blancs montés. Cuire environ 45 min à 180 °C."],["Alsace","Apéritif","Bretzels moelleux","farine;eau tiède;levure boulangère;beurre;bicarbonate;gros sel","Pétrir farine, eau, levure et beurre puis laisser lever. Former les bretzels, les plonger brièvement dans l’eau frémissante avec bicarbonate, parsemer de gros sel et cuire 15 min à 200 °C."],["Alsace","Plat","Bibeleskaes et pommes de terre","fromage blanc;crème;échalote;ciboulette;persil;pommes de terre","Mélanger fromage blanc et crème avec échalote et herbes ciselées. Cuire les pommes de terre à l’eau ou à la vapeur. Servir chaud avec le fromage blanc aux herbes."],["Provence","Plat","Daube provençale","bœuf à braiser;vin rouge;carottes;oignon;ail;orange;thym;laurier","Faire mariner le bœuf en cubes avec vin, légumes, ail et aromates une nuit. Faire dorer la viande, ajouter la marinade et le zeste d’orange. Couvrir et mijoter 2 h 30 à 3 h."],["Provence","Plat","Tian provençal","courgettes;tomates;oignons;ail;huile d’olive;thym","Couper les légumes en rondelles. Les ranger en alternance dans un plat huilé avec ail, thym et huile d’olive. Cuire environ 50 min à 180 °C."],["Provence","Entrée","Tomates à la provençale","tomates;ail;persil;chapelure;huile d’olive","Couper les tomates en deux. Mélanger ail, persil, chapelure et huile puis répartir sur les tomates. Cuire 25 à 30 min à 190 °C."],["Provence","Plat","Petits farcis provençaux","tomates;poivrons;chair à saucisse;bœuf haché;oignon;ail;chapelure","Évider tomates et poivrons. Mélanger les viandes avec oignon, ail et chapelure puis garnir les légumes. Cuire environ 45 min à 180 °C."],["Provence","Plat","Pâtes au pistou","pâtes;basilic;ail;parmesan;huile d’olive;pignons","Mixer basilic, ail, parmesan, pignons et huile pour obtenir le pistou. Cuire les pâtes, garder un peu d’eau de cuisson et mélanger avec le pistou."],["Provence","Apéritif","Tapenade noire","olives noires dénoyautées;câpres;ail;huile d’olive;citron","Mixer olives, câpres et ail. Ajouter l’huile et le citron jusqu’à obtenir une pâte. Réserver au frais et servir sur des tartines."],["Provence","Biscuits maison","Navettes à la fleur d’oranger","farine;sucre;œuf;huile d’olive douce;eau de fleur d’oranger","Mélanger œuf et sucre puis ajouter huile, fleur d’oranger et farine. Former des petits boudins, pincer les extrémités et inciser le centre. Cuire 15 à 18 min à 180 °C."],["Provence","Dessert","Pompe à l’huile","farine;huile d’olive douce;eau tiède;sucre;levure boulangère;fleur d’oranger","Délayer la levure dans l’eau tiède puis ajouter farine, sucre, huile et fleur d’oranger. Pétrir et laisser lever. Étaler en disque, pratiquer quelques entailles et cuire environ 20 min à 180 °C."],["Provence","Dessert","Tarte tropézienne simplifiée","brioche;lait;jaunes d’œufs;sucre;maïzena;crème entière;fleur d’oranger","Préparer une crème pâtissière avec lait, jaunes, sucre et maïzena puis refroidir. Monter la crème en chantilly et l’incorporer avec la fleur d’oranger. Garnir la brioche et réserver au frais."],["Provence","Plat","Aïoli de légumes et œufs","œufs;carottes;pommes de terre;haricots verts;jaune d’œuf;ail;huile;citron","Cuire les légumes à la vapeur et les œufs durs. Monter l’aïoli avec ail, jaune d’œuf et huile en filet puis ajouter le citron. Servir les légumes et les œufs avec l’aïoli."],["Bretagne","Plat","Galettes complètes","farine de sarrasin;œuf;eau;jambon;fromage râpé","Mélanger farine de sarrasin, œuf et eau puis laisser reposer. Cuire les galettes dans une poêle chaude. Garnir de jambon, fromage et œuf, replier et cuire jusqu’à ce que le blanc soit pris."],["Bretagne","Dessert","Crêpes bretonnes au froment","farine;œufs;lait;beurre fondu;sucre;sucre vanillé","Mélanger farine, sucres et œufs. Verser le lait progressivement puis ajouter le beurre. Laisser reposer 30 min et cuire de fines crêpes."],["Bretagne","Dessert","Far breton aux pruneaux","farine;sucre;œufs;lait;pruneaux;beurre","Beurrer un plat et répartir les pruneaux. Fouetter œufs et sucre, ajouter farine puis lait. Verser sur les pruneaux et cuire 45 à 50 min à 180 °C."],["Bretagne","Dessert","Kouign-amann","farine;levure boulangère;eau tiède;beurre demi-sel;sucre","Mélanger farine, levure et eau, pétrir et laisser lever. Étaler, déposer beurre et sucre puis plier en trois avec des repos au frais. Former un disque et cuire 35 à 40 min à 190 °C."],["Bretagne","Dessert","Gâteau breton","farine;beurre demi-sel;sucre;jaunes d’œufs","Travailler beurre et sucre puis ajouter les jaunes et la farine. Étaler dans un moule beurré, dessiner des croisillons et dorer. Cuire environ 35 min à 180 °C."],["Bretagne","Biscuits maison","Palets bretons","farine;beurre demi-sel;sucre;jaunes d’œufs;levure chimique","Fouetter les jaunes avec le sucre puis incorporer le beurre mou. Ajouter farine et levure, former un boudin et réserver au frais. Couper en rondelles et cuire 15 min à 170 °C."],["Bretagne","Dessert","Caramel au beurre salé","sucre;beurre demi-sel;crème entière;fleur de sel","Chauffer la crème. Faire fondre le sucre à sec jusqu’à obtenir un caramel ambré. Hors du feu, ajouter beurre puis crème chaude progressivement. Mélanger."],["Bretagne","Dessert","Pommes au four au cidre","pommes;beurre;sucre;cidre doux;cannelle","Évider les pommes et les placer dans un plat. Garnir de beurre, sucre et cannelle. Verser le cidre dans le plat et cuire 35 min à 180 °C en arrosant."],["Bretagne","Plat","Andouille de Guémené et pommes de terre function regionalIngredientLine(item){
 const x=item.trim().toLocaleLowerCase('fr');
 const rules=[
  [/^pâte (brisée|feuilletée|sablée)$/,'1 rouleau'],[/^pâte fine$/,'1 grande pâte fine'],[/^pâte$/,'1 pâte'],[/^crêpes salées$/,'3 crêpes'],[/^brioche$/,'1 brioche de 300 g'],
  [/^(bœuf|boeuf|veau|agneau|porc|poulet|chair à saucisse|veau haché|bœuf haché|boeuf haché|gras-double)/,'400 g'],[/^saucisson à cuire$/,'1 saucisson (environ 350 g)'],[/^saucisses/,'3 saucisses'],[/^andouille/,'200 g'],[/^jambon/,'3 tranches'],[/^lardons$/,'120 g'],[/^poitrine demi-sel$/,'200 g'],
  [/^(pommes de terre|pomme de terre)$/,'600 g'],[/^carottes?$/,'2 moyennes'],[/^oignons?$/,'2 moyens'],[/^échalote$/,'1'],[/^ail$/,'2 gousses'],[/^poireaux?$/,'2'],[/^céleri|^cèleri/,'1 branche'],[/^endives?$/,'3'],[/^tomates?$/,'3 moyennes'],[/^courgettes?$/,'2 petites'],[/^poivrons?$/,'2'],[/^champignons?$/,'200 g'],[/^haricots verts$/,'200 g'],[/^cardons/,'500 g'],[/^salade frisée$/,'1 petite salade'],
  [/^farine/,'200 g'],[/^farine de sarrasin$/,'180 g'],[/^farine de maïs$/,'150 g'],[/^œufs?$/,'3'],[/^jaunes? d’œufs?$/,'2'],[/^blancs? d’œufs?$/,'2'],[/^lait/,'25 cl'],[/^crème/,'20 cl'],[/^fromage blanc/,'250 g'],[/^beurre/,'60 g'],[/^sucre/,'80 g'],[/^chocolat/,'100 g'],[/^cheddar$/,'180 g'],[/^maroilles$/,'180 g'],[/^gruyère râpé$/,'80 g'],[/^fromage râpé$/,'80 g'],[/^parmesan$/,'40 g'],[/^pâte de pruneaux|^pruneaux$/,'100 g'],[/^raisins secs$/,'60 g'],[/^amandes$/,'30 g'],[/^poudre d’amande$/,'125 g'],[/^pralines roses$/,'200 g'],[/^confiture/,'150 g'],
  [/^bière/,'15 cl'],[/^vin blanc$/,'15 cl'],[/^vin rouge$/,'25 cl'],[/^cidre/,'15 cl'],[/^bouillon/,'30 cl'],[/^huile/,'2 c. à soupe'],[/^moutarde$/,'1 c. à soupe'],[/^chapelure$/,'40 g'],[/^levure/,'1 sachet'],[/^eau/,'15 cl'],[/^sel$/,'1 pincée'],[/^poivre$/,'à votre goût'],[/^thym|^laurier|^persil|^ciboulette|^basilic|^vanille|^cannelle|^muscade|^piment|^baies/,'1 petite dose'],[/^citron$/,'½'],[/^orange$/,'½'],[/^pommes?$/,'3'],[/^riz/,'100 g'],[/^pâtes$/,'240 g'],[/^quenelles/,'3 pièces'],[/^olives/,'100 g'],[/^câpres$/,'1 c. à soupe'],[/^œuf/,'3']
 ];
 const hit=rules.find(([re])=>re.test(x));
 const amount=hit?hit[1]:'quantité à ajuster';
 const grams=amount.replace(' g',' grammes');
 if(grams.endsWith(' grammes'))return '- '+grams+' de '+item.trim();
 if(amount.endsWith(' cl'))return '- '+amount.replace(' cl',' centilitres')+' de '+item.trim();
 if(amount.includes('moyenne')||amount.includes('moyens')||amount.includes('petites'))return '- '+amount+' '+item.trim();
 return '- '+amount+' de '+item.trim();
}
function regionalPrepSteps(text){
 return String(text||'').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean).map((x,i)=>(i+1)+' / '+x).join('\n');
}
function refreshRegionalRecipes(){
 const byName=new Map(regionalRecipeData.map(r=>[r[2].trim().toLocaleLowerCase('fr'),r]));
 let changed=0;
 recipes=recipes.map(existing=>{
  const source=byName.get(String(existing.name||'').trim().toLocaleLowerCase('fr'));
  if(!source)return existing;
  changed++;
  return {...existing,region:source[0],category:source[1],ingredients:source[3].split(';').map(regionalIngredientLine).join('\\n'),preparation:regionalPrepSteps(source[4]),servings:3,prepTime:20,cookTime:35,regionalCollection:true,favorite:!!existing.favorite,photo:existing.photo||''};
 });
 return changed;
}
function addRegionalRecipes(){
 const byName=new Map(recipes.map((r,i)=>[String(r.name||'').trim().toLocaleLowerCase('fr'),i]));
 let added=0,updated=0;
 regionalRecipeData.forEach(r=>{
  const key=r[2].trim().toLocaleLowerCase('fr');
  const enriched={region:r[0],category:r[1],name:r[2],ingredients:r[3].split(';').map(regionalIngredientLine).join('\n'),preparation:regionalPrepSteps(r[4]),servings:3,prepTime:20,cookTime:35,regionalCollection:true};
  if(byName.has(key)){
   const i=byName.get(key);
   if(recipes[i].regionalCollection){
    recipes[i]={...recipes[i],...enriched,favorite:!!recipes[i].favorite,photo:recipes[i].photo||''};
    updated++;
   }
  }else{
   recipes.push({...enriched,favorite:false});
   added++;
  }
 });
 save('recipes',recipes);
 renderRecipes();
 alert(added+' recettes ajoutées et '+updated+' recettes régionales mises à jour. Les quantités sont prévues pour 3 personnes ; ajuste-les si nécessaire.');
}

 ${meal?'<button class="light" onclick="clearPlannedMeal(\''+key+'\',\''+slot+'\')">Supprimer ce repas</button>':''}
 </div>`;
}
function suggestWeekMeals(){
 if(!recipes.length)return alert('Enregistre d’abord quelques recettes.');
 const start=weekStart(planningWeekOffset),used=new Set();
 for(let day=0;day<7;day++){
  const d=new Date(start);d.setDate(d.getDate()+day);const key=dateKey(d);
  const dayPlan=plans[key]||{lunch:null,dinner:null};
  ['lunch','dinner'].forEach(slot=>{
   if(dayPlan[slot]){const old=recipeForMeal(dayPlan[slot]);if(old)used.add(old.name);return}
   let pool=recipes.filter(r=>!used.has(r.name));if(!pool.length)pool=recipes;
   const scores=pool.map(r=>{const lines=(r.ingredients||'').split(/\\r?\\n/).filter(Boolean);const matched=lines.filter(line=>inventoryHas(ingredientParts(line).name)).length;return {r,score:lines.length?matched/lines.length:0}});
   scores.sort((a,b)=>b.score-a.score);const top=scores.filter(x=>x.score===scores[0].score);
   const chosen=top[Math.floor(Math.random()*top.length)].r;
   used.add(chosen.name);dayPlan[slot]={name:chosen.name,recipeIndex:recipes.indexOf(chosen),ingredients:chosen.ingredients||'',recipeServings:Number(chosen.servings)||3,servings:Number(get('defaultPeople',3))||3};
  });
  plans[key]=dayPlan;
 }
 save('plans',plans);renderPlanning();
}
function changePlanningWeek(delta){planningWeekOffset+=delta;renderPlanning()}
function selectPlannedRecipe(key,slot,value){
 const custom=document.getElementById(key+'-'+slot+'-custom');
 if(custom)custom.hidden=value!=='custom';
 if(value!=='custom'&&value!==''){
  const recipe=recipes[Number(value)];
  const servings=document.getElementById(key+'-'+slot+'-servings');
  if(servings&&recipe?.servings)servings.value=3;
 }
}
function savePlannedMeal(key,slot){
 const select=document.getElementById(key+'-'+slot+'-recipe');
 const servings=Math.max(1,Number(document.getElementById(key+'-'+slot+'-servings').value)||3);
 let meal=null;
 if(select.value==='custom'){
  const name=document.getElementById(key+'-'+slot+'-name').value.trim();
  if(!name)return alert('Indique le nom du repas.');
  meal={name,custom:true,servings};
 }else if(select.value!==''){
  const index=Number(select.value);const recipe=recipes[index];
  if(!recipe)return alert('Cette recette n’existe plus.');
  meal={name:recipe.name,recipeIndex:index,ingredients:recipe.ingredients||'',recipeServings:Number(recipe.servings)||3,servings};
 }else{
  return alert('Choisis une recette ou sélectionne « Autre repas ».');
 }
 if(!plans[key]||!plans[key].lunch&&!plans[key].dinner)plans[key]={lunch:null,dinner:null};
 plans[key][slot]=meal;save('plans',plans);renderPlanning();
}
function clearPlannedMeal(key,slot){if(plans[key]){plans[key][slot]=null;save('plans',plans)}renderPlanning()}
function weeklyMeals(start){
 const out=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const day=getDayPlan(dateKey(d));['lunch','dinner'].forEach(slot=>{if(day[slot]?.ingredients)out.push({name:day[slot].name,ingredients:day[slot].ingredients,servings:day[slot].servings||3,recipeServings:day[slot].recipeServings||3})})}return out;
}
function weeklyIngredientLines(start){
 const lines=[];weeklyMeals(start).forEach(meal=>meal.ingredients.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).forEach(item=>lines.push(item)));
 return [...new Set(lines)];
}
function weeklyIngredientsHtml(start){
 const lines=weeklyIngredientLines(start);return lines.length?'<ul>'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">Ajoute des recettes au planning pour voir les ingrédients nécessaires.</p>';
}
function addWeeklyIngredients(){
 const lines=weeklyIngredientLines(weekStart(planningWeekOffset));let added=0;
 lines.forEach(name=>{if(!shopping.some(x=>x.name.toLowerCase()===name.toLowerCase()&&!x.done)){shopping.push({name,done:false});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) ajouté(s) à la liste de courses.');page('shopping');
}
function randomRecipe(){let r=recipes.length?recipes[Math.floor(Math.random()*recipes.length)].name:'Ajoute d’abord quelques recettes !';document.getElementById('random').textContent=r}
page('home');
</script>

<script>
/* Fonctions enrichies de Notre Cuisine. Les données existantes restent conservées dans ce navigateur. */
let recipeSearchText='',showFavoritesOnly=false,editingRecipe=-1;
function normalized(s){return String(s||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function todayPlanData(){return getDayPlan(todayKey())}
function recipeForMeal(meal){if(!meal)return null;if(Number.isInteger(meal.recipeIndex))return recipes[meal.recipeIndex]||null;return recipes.find(r=>r.name===meal.name)||null}
function page(p){
 const app=document.getElementById('app');
 if(p==='home'){
  const day=todayPlanData(),l=day.lunch,d=day.dinner;
  const near=stock.filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+3*86400000).toISOString().slice(0,10));
  app.innerHTML='<h2>Que mange-t-on aujourd’hui ?</h2>'+
   '<div class="card"><h3>☀️ Déjeuner</h3><b>'+esc(l?.name||'Aucun repas prévu')+'</b><p><button class="light" onclick="page(\'planning\')">Voir le planning</button></p></div>'+
   '<div class="card"><h3>🌙 Dîner</h3><b>'+esc(d?.name||'Aucun repas prévu')+'</b><p><button class="light" onclick="page(\'planning\')">Voir le planning</button></p></div>'+
   '<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Une recette de votre bibliothèque, en tenant compte des produits disponibles.</p><button onclick="randomRecipe()">Trouver une idée</button><div id="random"></div></div>'+
   '<div class="recipe-grid">'+
   '<div class="card" onclick="page(\'stock\')">🥕 <b>Inventaire</b><p class="mini">'+stock.length+' produit(s)</p></div>'+
   '<div class="card" onclick="page(\'shopping\')">🛒 <b>Courses</b><p class="mini">'+shopping.filter(x=>!x.done).length+' article(s) à acheter</p></div>'+
   '<div class="card" onclick="page(\'recipes\')">🍲 <b>Recettes</b><p class="mini">'+recipes.length+' recette(s)</p></div>'+
   '<div class="card" onclick="page(\'planning\')">📅 <b>Planning</b><p class="mini">Organiser la semaine</p></div></div>'+
   '<div class="card"><h3>🔔 À ne pas oublier</h3><p>'+near.length+' produit(s) à consommer rapidement.</p><button class="light" onclick="page(\'alerts\')">Voir mes alertes</button></div>';
 }
 if(p==='stock')renderStock();
 if(p==='shopping')renderShopping();
 if(p==='recipes')renderRecipes();
 if(p==='planning')renderPlanning();
 if(p==='alerts'){
  const today=todayKey(),soon=new Date(Date.now()+3*86400000).toISOString().slice(0,10);
  const expired=stock.filter(x=>x.expiry&&x.expiry<today),close=stock.filter(x=>x.expiry&&x.expiry>=today&&x.expiry<=soon);
  app.innerHTML='<h2>🔔 Alertes</h2><div class="card"><h3>🚨 Dates dépassées</h3>'+
   (expired.map(x=>'<div class="item">'+esc(x.name)+' — '+esc(x.expiry)+'</div>').join('')||'<p class="empty">Aucun produit périmé renseigné.</p>')+
   '</div><div class="card"><h3>⏰ À consommer dans les 3 jours</h3>'+
   (close.map(x=>'<div class="item">'+esc(x.name)+' — '+esc(x.expiry)+'</div>').join('')||'<p class="empty">Aucune date proche.</p>')+
   '<p class="small">Les alertes s’affichent dans l’application. Les notifications push seront possibles après la mise en place d’un service en ligne.</p></div>';
 }
 if(p==='settings'){
  app.innerHTML='<h2>⚙️ Paramètres</h2><div class="card"><h3>🌿 Notre Cuisine</h3><p>Application familiale en construction.</p><p class="small">Pour le moment, les données sont enregistrées dans ce navigateur uniquement. La création des comptes et la synchronisation entre vos deux téléphones seront ajoutées avec Supabase.</p><h3>👨‍👩‍👦 Foyer</h3><label>Nombre de personnes par défaut</label><input id="defaultPeople" type="number" min="1" max="20" value="'+(get('defaultPeople',3))+'"><button onclick="saveDefaultPeople()">Enregistrer</button><p class="small">Le planning utilise 3 personnes par défaut, modifiables pour chaque repas.</p></div>';
 }
}
function saveDefaultPeople(){const n=Math.max(1,Number(document.getElementById('defaultPeople').value)||3);save('defaultPeople',n);alert('Nombre de personnes enregistré.');}
function renderStock(){
 const app=document.getElementById('app');
 const shown=stock.filter(x=>(x.place||'Réfrigérateur')===stockPlace&&x.name.toLowerCase().includes(stockSearch.toLowerCase()));
 app.innerHTML='<h2>🥕 Mon inventaire</h2><div class="tabs">'+places.map(x=>'<button class="'+(stockPlace===x?'active':'light')+'" onclick="stockPlace=\''+x+'\';renderStock()">'+(x==='Placard'?'🥫':x==='Réfrigérateur'?'🥛':'❄️')+' '+x+'</button>').join('')+'</div>'+
 '<div class="card"><h3>Ajouter un aliment</h3><label>Nom du produit</label><input id="product" placeholder="Ex : Pâtes, lait, poulet…"><label>Quantité / conditionnement</label><input id="quantity" placeholder="Ex : 2 paquets, 500 g, pack de 6"><label>Date limite (facultatif)</label><input id="expiry" type="date"><label>Code-barres (facultatif)</label><div style="display:flex;gap:6px"><input id="barcode" placeholder="Code-barres" style="flex:1"><button class="light" onclick="scanBarcode()">📷 Scanner</button></div><video id="barcodeVideo" playsinline hidden style="width:100%;border-radius:12px"></video><button onclick="addStock()">Ajouter dans '+stockPlace.toLowerCase()+'</button><p class="mini">Le scan lit le code. Le nom du produit reste à saisir pour le moment.</p></div>'+
 '<div class="card"><h3>🔎 Rechercher</h3><input value="'+esc(stockSearch)+'" placeholder="Rechercher un aliment…" oninput="stockSearch=this.value;renderStockKeepFocus(this.value)" id="stockSearch"><h3>'+stockPlace+'</h3>'+
 (shown.map(x=>{let i=stock.indexOf(x);return '<div class="item"><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.quantity||'Quantité non précisée')+(x.expiry?' · Date : '+esc(x.expiry):'')+(x.barcode?' · Code : '+esc(x.barcode):'')+'</span><label class="small">Déplacer vers :</label><select onchange="moveStock('+i+',this.value)">'+places.map(pl=>'<option '+(pl===(x.place||'Réfrigérateur')?'selected':'')+'>'+pl+'</option>').join('')+'</select><button class="light" onclick="consumeStock('+i+')">Produit terminé</button><button class="light" onclick="removeStock('+i+')">Supprimer</button></div>'}).join('')||'<p class="empty">Aucun produit dans cet espace.</p>')+'</div>';
}
async function scanBarcode(){
 const video=document.getElementById('barcodeVideo');
 if(!('BarcodeDetector' in window)){alert('Le scan de code-barres n’est pas pris en charge par ce navigateur. Tu peux saisir le code manuellement.');return}
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.hidden=false;await video.play();const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});const scan=async()=>{if(video.hidden)return;const codes=await detector.detect(video);if(codes.length){document.getElementById('barcode').value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());video.hidden=true;alert('Code-barres lu. Complète le nom du produit puis ajoute-le.')}else requestAnimationFrame(scan)};scan()}catch(e){alert('Impossible d’accéder à la caméra. Vérifie les autorisations de ton navigateur.')}
}
function consumeStock(i){stock.splice(i,1);save('stock',stock);renderStock()}
function renderShopping(){
 const app=document.getElementById('app');
 const groups={'Fruits et légumes':/tomate|salade|carotte|oignon|ail|poivron|pomme|legume|champignon|radis|haricot|patate|butternut/i,'Viande et traiteur':/poulet|boeuf|porc|jambon|viande|saucisse|lardon/i,'Produits frais':/lait|fromage|yaourt|beurre|creme|oeuf|skyr/i,'Épicerie':/farine|pate|riz|sucre|huile|sel|poivre|conserve|pain|biscuit/i,'Boissons':/eau|goudale|pepsi|jus|soda|boisson/i};
 const open=shopping.filter(x=>!x.done),done=shopping.filter(x=>x.done);
 const grouped={};open.forEach((x,i)=>{let cat=Object.keys(groups).find(k=>groups[k].test(x.name))||'Autres';(grouped[cat]??=[]).push({x,index:shopping.indexOf(x)})});
 app.innerHTML='<h2>🛒 Liste de courses</h2><div class="card"><h3>Ajouter un article</h3><input id="buy" placeholder="Ex : Pain, lait, œufs"><button onclick="addBuy()">Ajouter</button></div>'+
 '<div class="card"><h3>À acheter ('+open.length+')</h3>'+(Object.keys(grouped).map(cat=>'<div class="shopping-group"><h3>'+cat+'</h3>'+grouped[cat].map(({x,index})=>'<div class="item"><label><input type="checkbox" style="width:auto" onchange="checkBuy('+index+')" '+(x.done?'checked':'')+'> '+esc(x.name)+'</label><button class="light" onclick="removeBuy('+index+')">Supprimer</button></div>').join('')+'</div>').join('')||'<p class="empty">Aucun article à acheter.</p>')+'</div>'+
 '<div class="card"><h3>✓ Déjà acheté ('+done.length+')</h3>'+(done.map(x=>'<div class="item"><s>'+esc(x.name)+'</s></div>').join('')||'<p class="empty">Les articles cochés apparaîtront ici.</p>')+'<button class="light" onclick="clearCompletedShopping()">Effacer les articles achetés</button></div>';
}
function clearCompletedShopping(){shopping=shopping.filter(x=>!x.done);save('shopping',shopping);renderShopping()}
function renderRecipes(){
 const app=document.getElementById('app');
 const filtered=recipes.map((r,i)=>({...r,_i:i})).filter(r=>(recipeCategoryFilter==='Toutes'||r.category===recipeCategoryFilter)&&(!showFavoritesOnly||r.favorite)&&normalized(r.name+' '+r.ingredients).includes(normalized(recipeSearchText)));
 app.innerHTML='<h2>🍲 Nos recettes</h2><div class="card"><details><summary style="color:var(--green);font-weight:700;font-size:18px;cursor:pointer;padding:5px 0">＋ Ajouter une recette</summary><div style="padding-top:14px"><p class="small">Ajoute une photo via un lien d’image, les ingrédients avec quantités (un par ligne), et les étapes.</p><label>Lien de la recette originale (facultatif)</label><input id="recipeUrl" type="url" placeholder="https://…"><button class="light" type="button" onclick="openRecipeLink()">🔗 Ouvrir la recette</button><label>Copie-colle ici le texte de la recette trouvé sur le site</label><textarea id="recipePaste" placeholder="Colle le texte complet de la recette ici…"></textarea><button class="light" type="button" onclick="fillRecipeFromPaste()">✨ Pré-remplir la fiche à partir du texte</button><p id="recipeImportStatus" class="mini">L’import automatique des sites n’est pas fiable sur téléphone. Cette méthode fonctionne sans déploiement Supabase.</p><label>Nom de la recette</label><input id="rname" placeholder="Ex : Welsh traditionnel"><label>Catégorie</label><select id="category">'+categories.map(x=>'<option>'+x+'</option>').join('')+'</select><label>Photo (URL d’image facultative)</label><input id="rphoto" type="url" placeholder="https://…jpg"><label>Ingrédients (un par ligne, avec quantité)</label><textarea id="ingredients" placeholder="200 g de farine&#10;3 œufs&#10;20 cl de lait"></textarea><label>Préparation</label><textarea id="preparation" placeholder="Décris les étapes de préparation"></textarea><label>Temps de préparation (minutes)</label><input id="prepTime" type="number" min="0" placeholder="Ex. 15"><label>Temps de cuisson (minutes)</label><input id="cookTime" type="number" min="0" placeholder="Ex. 30"><label>Nombre de personnes pour les quantités indiquées</label><input id="servings" type="number" min="1" value="'+get('defaultPeople',3)+'"><button onclick="addRecipe()">Enregistrer dans mes recettes</button></div></details></div>'+
 '<div class="card"><h3>📖 Ma bibliothèque</h3><input placeholder="Rechercher une recette ou un ingrédient…" value="'+esc(recipeSearchText)+'" oninput="recipeSearchText=this.value;renderRecipesKeepFocus()"><div class="tabs"><button class="'+(recipeCategoryFilter==='Toutes'?'active':'light')+'" onclick="recipeCategoryFilter=\'Toutes\';renderRecipes()">Toutes</button>'+categories.map(c=>'<button class="'+(recipeCategoryFilter===c?'active':'light')+'" onclick="recipeCategoryFilter=\''+c+'\';renderRecipes()">'+c+'</button>').join('')+'<button class="'+(showFavoritesOnly?'active':'light')+'" onclick="showFavoritesOnly=!showFavoritesOnly;renderRecipes()">♥ Favoris</button></div>'+
 (filtered.length?'<div class="recipe-grid">'+filtered.map(r=>'<div class="recipe-card">'+(r.photo?'<img src="'+esc(r.photo)+'" alt="Photo de '+esc(r.name)+'" onerror="this.style.display=\'none\'">':'<div style="height:90px;background:#eef0e7;display:grid;place-items:center;font-size:34px">🍲</div>')+'<div class="inside"><b>'+esc(r.name)+'</b><p class="mini">'+esc(r.category)+' · '+(r.servings||3)+' pers.</p><button class="light" onclick="toggleFavorite('+r._i+')">'+(r.favorite?'♥ Favori':'♡ Ajouter aux favoris')+'</button><button class="light" onclick="window.showRecipe('+r._i+')">Voir la recette</button><button class="light" onclick="editRecipe('+r._i+')">Modifier</button><button class="light" onclick="deleteRecipe('+r._i+')">Supprimer</button></div></div>').join('')+'</div>':'<p class="empty">Aucune recette ne correspond à cette recherche.</p>')+'</div>';
}
function renderRecipesKeepFocus(){const el=document.querySelector('.card input[placeholder^="Rechercher une recette"]');const pos=el?.selectionStart;renderRecipes();const next=document.querySelector('.card input[placeholder^="Rechercher une recette"]');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function openRecipeLink(){
 const url=document.getElementById('recipeUrl').value.trim();
 if(!url)return alert('Colle d’abord le lien de la recette.');
 try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;window.open(u.href,'_blank','noopener')}
 catch(e){alert('Vérifie que le lien commence par https://')}
}
function fillRecipeFromPaste(){
 const text=document.getElementById('recipePaste').value.trim();
 const status=document.getElementById('recipeImportStatus');
 if(!text){status.textContent='Colle d’abord le texte de la recette.';return}
 const lines=text.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
 const heading=(s)=>/^(ingrédients?|ingredients?|préparation|preparation|instructions?|étapes?|etapes?|directions?|méthode|methode|pour .*|cuisson)$/i.test(s);
 let ingredientStart=lines.findIndex(x=>/^ingrédients?\\s*:?”?$/i.test(x)||/^ingredients?\\s*:?”?$/i.test(x));
 let prepStart=lines.findIndex(x=>/^(préparation|preparation|instructions?|étapes?|etapes?|directions?|méthode|methode)\\s*:?.*$/i.test(x));
 let name=document.getElementById('rname');
 if(!name.value&&lines.length)name.value=lines[0].slice(0,100);
 let ingredients='',preparation='';
 if(ingredientStart>=0){
  const stop=prepStart>ingredientStart?prepStart:lines.length;
  ingredients=lines.slice(ingredientStart+1,stop).filter(x=>!heading(x)).join('\\n');
 }else{
  const cutoff=prepStart>=0?prepStart:Math.max(1,Math.ceil(lines.length/2));
  ingredients=lines.slice(1,cutoff).join('\\n');
 }
 if(prepStart>=0)preparation=lines.slice(prepStart+1).filter(x=>!/^bon appétit|bonne dégustation/i.test(x)).join('\\n');
 else if(ingredientStart>=0)preparation=lines.slice(ingredientStart+1).filter(x=>!heading(x)).join('\\n');
 if(ingredients)document.getElementById('ingredients').value=ingredients;
 if(preparation)document.getElementById('preparation').value=preparation;
 status.textContent='Fiche pré-remplie avec le texte collé. Vérifie bien les ingrédients et les étapes avant d’enregistrer.';
}
function addRecipe(){
 const name=document.getElementById('rname').value.trim();if(!name)return alert('Ajoute le nom de la recette.');
 const url=document.getElementById('recipeUrl').value.trim(),photo=document.getElementById('rphoto').value.trim();
 for(const link of [url,photo])if(link){try{const u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw 0}catch(e){return alert('Vérifie les liens saisis. Ils doivent commencer par https://')}}
 const r={name,category:document.getElementById('category').value,ingredients:document.getElementById('ingredients').value,preparation:document.getElementById('preparation').value,servings:Math.max(1,Number(document.getElementById('servings').value)||3),url,photo,favorite:false};
 recipes.push(r);save('recipes',recipes);recipeSearchText='';renderRecipes();
}
function showRecipe(i){
 const r=recipes[i];if(!r)return;const app=document.getElementById('app');

function saveEditedRecipe(){
 const i=editingRecipe,r=recipes[i];if(!r)return;

 save('recipes',recipes);editingRecipe=-1;renderRecipes();

function ingredientParts(line){
 const m=String(line).trim().match(/^([0-9]+(?:[.,][0-9]+)?(?:\s*\/\s*[0-9]+)?)\s*(kg|g|mg|l|cl|ml|piece|pieces|pce|pcs)?\s*(?:de|d’|d')?\s*(.+)$/i);
 if(!m)return {name:String(line).trim(),amount:null,unit:''};
 let amount=m[1].includes('/')?m[1].split('/').reduce((a,b)=>a/Number(b),Number(m[1].split('/')[0])):Number(m[1].replace(',','.'));
 return {name:m[3].trim(),amount,unit:(m[2]||'').toLowerCase()};
}
function plannedIngredientNeeds(start){
 const needs={};
 for(let day=0;day<7;day++){const d=new Date(start);d.setDate(d.getDate()+day);const plan=getDayPlan(dateKey(d));
 ['lunch','dinner'].forEach(slot=>{const meal=plan[slot];if(!meal?.ingredients)return;
  const ratio=(Number(meal.servings)||3)/(Number(meal.recipeServings)||3);
  meal.ingredients.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
   const p=ingredientParts(line),key=normalized(p.name);if(!key)return;
   if(!needs[key])needs[key]={name:p.name,amount:0,unit:p.unit,hasAmount:false};
   if(p.amount!==null&&(!needs[key].unit||needs[key].unit===p.unit)){needs[key].amount+=p.amount*ratio;needs[key].hasAmount=true}
  });
 })}return Object.values(needs);
}
function inventoryHas(name){const n=normalized(name);return stock.some(s=>{const sn=normalized(s.name);return sn===n||sn.includes(n)||n.includes(sn)})}
function missingIngredients(start){return plannedIngredientNeeds(start).filter(x=>!inventoryHas(x.name))}
function formatNeed(x){return (x.hasAmount?Number(x.amount.toFixed(2)).toString()+(x.unit?' '+x.unit:'')+' ':'')+x.name}
function weeklyIngredientsHtml(start){
 const all=plannedIngredientNeeds(start),missing=missingIngredients(start);
 if(!all.length)return '<p class="empty">Ajoute des recettes avec leurs ingrédients au planning pour calculer les courses.</p>';
 return '<p><b>'+missing.length+' ingrédient(s) à prévoir</b> sur '+all.length+' au total.</p><ul>'+all.map(x=>'<li>'+esc(formatNeed(x))+(inventoryHas(x.name)?' <span class="pill">Déjà en stock</span>':'')+'</li>').join('')+'</ul>';
}
function addWeeklyIngredients(){
 const missing=missingIngredients(weekStart(planningWeekOffset));let added=0;
 missing.forEach(x=>{const name=formatNeed(x);if(!shopping.some(s=>normalized(s.name)===normalized(name)&&!s.done)){shopping.push({name,done:false,source:'planning'});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) manquant(s) ajouté(s) à la liste de courses.');page('shopping');
}
function addRecipeIngredients(i){
 const r=recipes[i];if(!r)return;let added=0;
 (r.ingredients||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const p=ingredientParts(line);if(!inventoryHas(p.name)&&!shopping.some(s=>normalized(s.name)===normalized(line)&&!s.done)){shopping.push({name:line,done:false});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) ajouté(s).');page('shopping');
}

 const recipe=recipeForMeal(meal);
 return '<div class="meal-box"><b>'+label+'</b>'+
 (recipe?.photo?'<img src="'+esc(recipe.photo)+'" alt="Photo de '+esc(recipe.name)+'">':'')+
 '<label>Recette</label><select id="'+key+'-'+slot+'-recipe" onchange="selectPlannedRecipe(\''+key+'\',\''+slot+'\',this.value)"><option value="">Choisir une recette…</option>'+recipeOptions+'<option value="custom" '+(custom?'selected':'')+'>Autre repas / saisie libre</option></select>'+
 '<div id="'+key+'-'+slot+'-custom" '+(custom?'':'hidden')+'><label>Nom du repas</label><input id="'+key+'-'+slot+'-name" value="'+esc(custom?meal?.name||'':'')+'" placeholder="Ex : Salade composée"></div>'+
 '<label>Nombre de personnes</label><input id="'+key+'-'+slot+'-servings" type="number" min="1" max="20" value="'+(meal?.servings||get('defaultPeople',3))+'">'+
 '<button onclick="savePlannedMeal(\''+key+'\',\''+slot+'\')">Enregistrer</button>'+
 (meal?'<button class="light" onclick="clearPlannedMeal(\''+key+'\',\''+slot+'\')">Supprimer</button><div class="mini">Déplacer ce repas vers un autre jour :</div><input type="date" id="'+key+'-'+slot+'-move"><button class="light" onclick="movePlannedMeal(\''+key+'\',\''+slot+'\')">Déplacer</button><button class="light" onclick="showMealRecipe(\''+key+'\',\''+slot+'\')">Voir la recette</button>':'')+'</div>';
}
function selectPlannedRecipe(key,slot,value){const custom=document.getElementById(key+'-'+slot+'-custom');if(custom)custom.hidden=value!=='custom'}
function savePlannedMeal(key,slot){
 const select=document.getElementById(key+'-'+slot+'-recipe'),servings=Math.max(1,Number(document.getElementById(key+'-'+slot+'-servings').value)||3);
 let meal;
 if(select.value==='custom'){const name=document.getElementById(key+'-'+slot+'-name').value.trim();if(!name)return alert('Indique le nom du repas.');meal={name,custom:true,servings}}
 else if(select.value!==''){const index=Number(select.value),r=recipes[index];if(!r)return alert('Cette recette n’existe plus.');meal={name:r.name,recipeIndex:index,ingredients:r.ingredients||'',recipeServings:Number(r.servings)||3,servings}}
 else return alert('Choisis une recette ou sélectionne « Autre repas ».');
 if(!plans[key]||!plans[key].lunch&&!plans[key].dinner)plans[key]={lunch:null,dinner:null};
 plans[key][slot]=meal;save('plans',plans);renderPlanning();
}
function movePlannedMeal(key,slot){
 const input=document.getElementById(key+'-'+slot+'-move'),target=input.value;if(!target)return alert('Choisis une date de destination.');
 if(!plans[key]?.[slot])return;const meal=plans[key][slot];const dest=plans[target]||{lunch:null,dinner:null};
 const targetSlot=dest[slot]? (slot==='lunch'?'dinner':'lunch'):slot;

function renderPlanning(){
 const app=document.getElementById('app'),start=weekStart(planningWeekOffset),end=new Date(start);end.setDate(end.getDate()+6);
 const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
 app.innerHTML='<h2>📅 Planning de la semaine</h2><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><button class="light" onclick="changePlanningWeek(-1)">← Précédente</button><b>'+start.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+end.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+'</b><button class="light" onclick="changePlanningWeek(1)">Suivante →</button></div><button class="light" onclick="planningWeekOffset=0;renderPlanning()">Cette semaine</button><button onclick="suggestWeekMeals()">✨ Proposer les repas de la semaine</button><p class="small">Suggestions : privilégie les ingrédients déjà en stock et évite les répétitions. Tu peux ensuite modifier chaque repas. 3 personnes par défaut.</p></div><div class="week-grid">'+days.map(d=>{const key=dateKey(d),day=getDayPlan(key);return '<div class="card"><h3 style="text-transform:capitalize">'+formatDay(d)+'</h3>'+renderMealEditor(key,'lunch','☀️ Déjeuner',day.lunch)+renderMealEditor(key,'dinner','🌙 Dîner',day.dinner)+'</div>'}).join('')+'</div><div class="card"><h3>🛒 Courses calculées pour la semaine</h3><p class="small">Les quantités sont adaptées au nombre de personnes. Les ingrédients dont le nom correspond à un produit de l’inventaire sont signalés comme déjà en stock.</p><div>'+weeklyIngredientsHtml(start)+'</div><button onclick="addWeeklyIngredients()">Ajouter les ingrédients manquants aux courses</button></div>';
}

function clearPlannedMeal(key,slot){if(plans[key]){plans[key][slot]=null;save('plans',plans)}renderPlanning()}
function randomRecipe(){
 const available=recipes.filter(r=>(r.ingredients||'').split(/\r?\n/).filter(Boolean).every(line=>{const p=ingredientParts(line);return inventoryHas(p.name)}));
 const pool=available.length?available:recipes;
 const r=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
 const box=document.getElementById('random');if(!box)return;
 box.innerHTML=r?'<b>'+esc(r.name)+'</b><p class="mini">'+(available.length?'Tous les ingrédients semblent disponibles dans le stock.':'Aucune recette entièrement disponible : voici une autre idée.')+'</p><button class="light" onclick="showRecipe('+recipes.indexOf(r)+')">Voir la recette</button>':'Ajoute d’abord quelques recettes !';
}

function addStock(){
 const name=document.getElementById('product').value.trim();if(!name)return alert('Indique le nom du produit.');
 stock.push({name,place:stockPlace,quantity:document.getElementById('quantity').value,expiry:document.getElementById('expiry').value,barcode:document.getElementById('barcode')?.value.trim()||''});
 save('stock',stock);stockSearch='';renderStock();
}
function unitBase(unit){
 const u=(unit||'').toLowerCase();
 if(u==='kg')return {type:'mass',factor:1000,unit:'g'};
 if(u==='g')return {type:'mass',factor:1,unit:'g'};
 if(u==='mg')return {type:'mass',factor:.001,unit:'g'};
 if(u==='l')return {type:'volume',factor:1000,unit:'ml'};
 if(u==='cl')return {type:'volume',factor:10,unit:'ml'};
 if(u==='ml')return {type:'volume',factor:1,unit:'ml'};
 if(['piece','pieces','pce','pcs'].includes(u))return {type:'count',factor:1,unit:'piece'};
 return null;
}
function parsedStockQuantity(value){
 const m=String(value||'').match(/([0-9]+(?:[.,][0-9]+)?)\s*(kg|g|mg|l|cl|ml|pieces?|pce|pcs)\b/i);
 if(!m)return null;const base=unitBase(m[2]);if(!base)return null;
 return {amount:Number(m[1].replace(',','.'))*base.factor,type:base.type,unit:base.unit};
}
function missingIngredients(start){
 return plannedIngredientNeeds(start).map(need=>{
  const target=unitBase(need.unit);if(!target||!need.hasAmount)return need;
  let available=0,unknown=false;
  stock.filter(s=>{const sn=normalized(s.name),n=normalized(need.name);return sn===n||sn.includes(n)||n.includes(sn)}).forEach(s=>{
   const q=parsedStockQuantity(s.quantity);
   if(!q)unknown=true;else if(q.type===target.type)available+=q.amount;
  });
  if(unknown)return null;
  const remaining=need.amount-available/target.factor;
  return remaining>0?{...need,amount:remaining}:null;
 }).filter(Boolean);
}
function weeklyIngredientsHtml(start){
 const all=plannedIngredientNeeds(start),missing=missingIngredients(start);
 if(!all.length)return '<p class="empty">Ajoute des recettes avec leurs ingrédients au planning pour calculer les courses.</p>';
 const missingNames=new Set(missing.map(x=>normalized(x.name)));
 return '<p><b>'+missing.length+' ingrédient(s) à prévoir</b> sur '+all.length+' au total.</p><ul>'+all.map(x=>'<li>'+esc(formatNeed(missing.find(m=>normalized(m.name)===normalized(x.name))||x))+(missingNames.has(normalized(x.name))?'':' <span class="pill">Quantité suffisante en stock</span>')+'</li>').join('')+'</ul>';
}
function addWeeklyIngredients(){
 const missing=missingIngredients(weekStart(planningWeekOffset));let added=0;
 missing.forEach(x=>{const name=formatNeed(x);if(!shopping.some(s=>normalized(s.name)===normalized(name)&&!s.done)){shopping.push({name,done:false,source:'planning'});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) manquant(s) ajouté(s) à la liste de courses.');page('shopping');
}
