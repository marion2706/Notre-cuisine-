<script>
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
function save(k,v){localStorage.setItem(k,JSON.stringify(v));if(window.cloudReady)scheduleCloudSave();}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ingredientLineFormat(line){
 const s=String(line||'').trim().replace(/^[-•]+\\s*/,'');
 const m=s.match(/^(.+?)\\s*:\\s*(.+)$/);
 if(!m)return s;
 const item=m[1].trim(),qty=m[2].trim();
 if(/^(rendement|pour|moule)/i.test(item))return item+' : '+qty;
 if(/^(œuf|oeuf|œufs|oeufs)$/i.test(item))return qty+' '+item.toLowerCase();
 if(/^(levure chimique|vanille|cacao non sucré|stévia)$/i.test(item))return qty+' de '+item.toLowerCase();
 return qty+' de '+item.toLowerCase();
}

let stock=get('stock',[]),shopping=get('shopping',[]),recipes=get('recipes',[]),plans=get('plans',{});
let stockPlace='Placard',stockSearch='';
const places=['Placard','Réfrigérateur','Congélateur'];
const categories=['Entrée','Plat','Dessert','Biscuits maison','Biscuits sans sucre','Apéritif']; const regions=[]; // Ancien filtre régional conservé vide : les recettes régionales ont été retirées.
let recipeCategoryFilter='Toutes'; window.recipeRegionFilter='Toutes';

// Disponible dès le premier script : les recettes sans sucre l'utilisent pendant leur initialisation.
function normalized(s){return String(s||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}

function ensureNoAddedSugarRecipes(){
 const additions=[
  {sourceId:'sans-sucre-cookies-v1',contentVersion:3,name:'Cookies chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:10,cookTime:12,photo:'',url:'',ingredients:'Farine de patate douce : 50 g\\nFarine de coco : 20 g\\nŒuf : 1 (environ 50 g sans coquille)\\nFromage blanc : 30 g\\nHuile de coco fondue : 40 g\\nChocolat noir 80 % : 30 g, coupé en pépites\\nLevure chimique : 2 g (1/2 cuillère à café rase)\\nStévia : dose indiquée sur le paquet pour remplacer 50 g de sucre\\nRendement : 6 cookies',preparation:'1. Préchauffer le four à 170 °C.\\n2. Faire fondre l’huile de coco et la laisser tiédir.\\n3. Mélanger l’œuf, le fromage blanc, l’huile fondue et la stévia.\\n4. Ajouter les deux farines et la levure. Mélanger : la pâte doit être épaisse et souple.\\n5. Incorporer les pépites de chocolat.\\n6. Diviser la pâte en 6 portions égales (environ 30 g chacune), former des boules puis les aplatir légèrement.\\n7. Cuire 10 à 12 minutes. Laisser refroidir 10 minutes sur la plaque avant de déplacer les cookies.'},
  {sourceId:'sans-sucre-muffins-v1',contentVersion:3,name:'Muffins chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:10,cookTime:20,photo:'',url:'',ingredients:'Farine de patate douce : 60 g\\nFarine de coco : 20 g\\nŒufs : 2 (environ 100 g sans coquille)\\nFromage blanc : 100 g\\nLait : 50 ml\\nHuile de coco fondue : 30 g\\nChocolat noir 80 % : 40 g, en petits morceaux\\nLevure chimique : 5 à 6 g (1/2 sachet)\\nStévia : dose indiquée sur le paquet pour remplacer 60 g de sucre\\nRendement : 6 muffins',preparation:'1. Préchauffer le four à 180 °C.\\n2. Fouetter les 2 œufs avec le fromage blanc, le lait, l’huile de coco tiédie et la stévia.\\n3. Ajouter la farine de patate douce, la farine de coco et la levure. Mélanger juste assez pour obtenir une pâte homogène.\\n4. Incorporer les 40 g de chocolat.\\n5. Répartir la pâte dans 6 moules à muffins, en les remplissant aux deux tiers.\\n6. Cuire 18 à 20 minutes. Vérifier avec la pointe d’un couteau, puis laisser tiédir avant de démouler.'},
  {sourceId:'sans-sucre-brownie-v1',contentVersion:3,name:'Brownie fondant au chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:10,cookTime:18,photo:'',url:'',ingredients:'Chocolat noir 80 % : 100 g\\nHuile de coco : 40 g\\nŒufs : 2 (environ 100 g sans coquille)\\nFromage blanc : 100 g\\nFarine de patate douce : 35 g\\nFarine de coco : 10 g\\nCacao non sucré : 10 g\\nStévia : dose indiquée sur le paquet pour remplacer 40 g de sucre\\nRendement : 6 parts (moule carré d’environ 15 cm)',preparation:'1. Préchauffer le four à 170 °C.\\n2. Faire fondre les 100 g de chocolat avec les 40 g d’huile de coco, doucement. Laisser tiédir.\\n3. Fouetter les 2 œufs avec la stévia.\\n4. Ajouter les 100 g de fromage blanc, puis le chocolat fondu tiédi.\\n5. Incorporer les 35 g de farine de patate douce, les 10 g de farine de coco et les 10 g de cacao. Mélanger sans trop travailler la pâte.\\n6. Verser dans un moule carré de 15 cm environ, chemisé de papier cuisson.\\n7. Cuire 15 à 18 minutes : le centre doit rester légèrement humide. Laisser refroidir complètement avant de couper en 6 parts.'},
  {sourceId:'sans-sucre-marbre-v1',contentVersion:3,name:'Gâteau marbré sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:15,cookTime:35,photo:'',url:'',ingredients:'Farine de patate douce : 70 g\\nFarine de coco : 15 g\\nŒufs : 2 (environ 100 g sans coquille)\\nFromage blanc : 120 g\\nHuile de coco fondue : 30 g\\nLait : 40 ml\\nLevure chimique : 5 à 6 g (1/2 sachet)\\nCacao non sucré : 10 g\\nStévia : dose indiquée sur le paquet pour remplacer 60 g de sucre\\nRendement : 6 parts (petit moule à cake d’environ 20 cm)',preparation:'1. Préchauffer le four à 170 °C.\\n2. Fouetter les 2 œufs avec la stévia. Ajouter les 120 g de fromage blanc, les 30 g d’huile de coco fondue et les 40 ml de lait.\\n3. Incorporer les 70 g de farine de patate douce, les 15 g de farine de coco et la levure.\\n4. Séparer la pâte en deux parts égales. Mélanger les 10 g de cacao dans l’une des deux moitiés.\\n5. Verser alternativement les deux pâtes dans un petit moule à cake de 20 cm, chemisé. Passer doucement la pointe d’un couteau pour marbrer.\\n6. Cuire 30 à 35 minutes. Vérifier la cuisson au centre et laisser tiédir avant de démouler.'},
  {sourceId:'sans-sucre-gateau-blanc-v1',contentVersion:3,name:'Gâteau façon gâteau au yaourt sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:10,cookTime:35,photo:'',url:'',ingredients:'Farine de patate douce : 80 g\\nFarine de coco : 20 g\\nŒufs : 2 (environ 100 g sans coquille)\\nFromage blanc : 150 g\\nHuile de coco fondue : 40 g\\nLait : 50 ml, puis jusqu’à 10 ml supplémentaires si nécessaire\\nLevure chimique : 5 à 6 g (1/2 sachet)\\nVanille : 1/2 cuillère à café (facultatif)\\nStévia : dose indiquée sur le paquet pour remplacer 60 g de sucre\\nRendement : 6 parts (moule rond de 18 cm)',preparation:'1. Préchauffer le four à 170 °C.\\n2. Fouetter les 2 œufs avec la stévia. Ajouter les 150 g de fromage blanc, les 40 g d’huile de coco fondue et la vanille.\\n3. Incorporer les 80 g de farine de patate douce, les 20 g de farine de coco et la levure.\\n4. Ajouter les 50 ml de lait. Si la pâte est très compacte, ajouter le lait restant petit à petit : la farine de coco absorbe beaucoup.\\n5. Verser dans un moule rond de 18 cm chemisé.\\n6. Cuire 30 à 35 minutes. La lame d’un couteau doit ressortir presque sèche. Laisser refroidir avant de couper en 6 parts.'},
  {sourceId:'sans-sucre-fondants-v1',contentVersion:3,name:'Mini fondants au chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:4,prepTime:10,cookTime:9,photo:'',url:'',ingredients:'Chocolat noir 80 % : 80 g\\nHuile de coco : 25 g\\nŒuf : 1 (environ 50 g sans coquille)\\nFromage blanc : 50 g\\nFarine de patate douce : 15 g\\nCacao non sucré : 5 g\\nStévia : dose indiquée sur le paquet pour remplacer 20 g de sucre\\nRendement : 4 petits fondants',preparation:'1. Préchauffer le four à 180 °C.\\n2. Faire fondre les 80 g de chocolat avec les 25 g d’huile de coco. Laisser tiédir.\\n3. Fouetter l’œuf avec la stévia, puis ajouter les 50 g de fromage blanc.\\n4. Incorporer le chocolat fondu, les 15 g de farine de patate douce et les 5 g de cacao.\\n5. Répartir équitablement dans 4 petits moules beurrés ou huilés.\\n6. Cuire 8 à 9 minutes pour conserver un cœur fondant. Laisser reposer 1 minute avant de démouler.'},
  {sourceId:'sans-sucre-pancakes-v1',contentVersion:3,name:'Pancakes moelleux au chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:2,prepTime:8,cookTime:10,photo:'',url:'',ingredients:'Farine de patate douce : 40 g\\nFarine de coco : 10 g\\nŒuf : 1 (environ 50 g sans coquille)\\nFromage blanc : 80 g\\nLait : 50 ml, puis 10 à 20 ml si nécessaire\\nLevure chimique : 2 g (1/2 cuillère à café rase)\\nChocolat noir 80 % : 10 g, finement haché\\nStévia : dose indiquée sur le paquet pour remplacer 15 g de sucre\\nRendement : 4 petits pancakes (2 par personne)',preparation:'1. Mélanger l’œuf, les 80 g de fromage blanc, les 50 ml de lait et la stévia.\\n2. Ajouter les 40 g de farine de patate douce, les 10 g de farine de coco et la levure. Mélanger.\\n3. Laisser reposer 3 minutes. Si la pâte est trop épaisse, ajouter 10 à 20 ml de lait.\\n4. Incorporer les 10 g de chocolat haché.\\n5. Faire chauffer une poêle antiadhésive à feu moyen-doux et la graisser très légèrement.\\n6. Verser 4 petites portions de pâte. Cuire environ 2 minutes, jusqu’à ce que des bulles apparaissent, retourner et cuire encore 1 minute.'},
  {sourceId:'sans-sucre-mini-cakes-v1',contentVersion:3,name:'Petits gâteaux moelleux au cacao sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:4,prepTime:10,cookTime:15,photo:'',url:'',ingredients:'Farine de patate douce : 45 g\\nFarine de coco : 10 g\\nŒuf : 1 (environ 50 g sans coquille)\\nFromage blanc : 70 g\\nHuile de coco fondue : 15 g\\nCacao non sucré : 10 g\\nLait : 30 ml\\nLevure chimique : 2 g (1/2 cuillère à café rase)\\nStévia : dose indiquée sur le paquet pour remplacer 25 g de sucre\\nRendement : 4 petits gâteaux',preparation:'1. Préchauffer le four à 175 °C.\\n2. Fouetter l’œuf avec la stévia. Ajouter les 70 g de fromage blanc, les 15 g d’huile de coco fondue et les 30 ml de lait.\\n3. Incorporer les 45 g de farine de patate douce, les 10 g de farine de coco, les 10 g de cacao et la levure.\\n4. Répartir dans 4 petits moules.\\n5. Cuire 13 à 15 minutes. Laisser tiédir 5 minutes avant de démouler.'},
  {sourceId:'sans-sucre-cake-choco-v1',contentVersion:3,name:'Cake au chocolat sans sucre ajouté',category:'Biscuits sans sucre',region:'',servings:6,prepTime:12,cookTime:30,photo:'',url:'',ingredients:'Farine de patate douce : 70 g\\nFarine de coco : 15 g\\nŒufs : 2 (environ 100 g sans coquille)\\nFromage blanc : 100 g\\nHuile de coco fondue : 25 g\\nChocolat noir 80 % : 50 g, à faire fondre\\nCacao non sucré : 10 g\\nLait : 40 ml\\nLevure chimique : 5 à 6 g (1/2 sachet)\\nStévia : dose indiquée sur le paquet pour remplacer 40 g de sucre\\nRendement : 6 tranches (moule à cake d’environ 20 cm)',preparation:'1. Préchauffer le four à 170 °C.\\n2. Faire fondre les 50 g de chocolat noir et laisser tiédir.\\n3. Fouetter les 2 œufs avec la stévia, puis ajouter les 100 g de fromage blanc, les 25 g d’huile de coco et les 40 ml de lait.\\n4. Incorporer le chocolat fondu.\\n5. Ajouter les 70 g de farine de patate douce, les 15 g de farine de coco, les 10 g de cacao et la levure. Mélanger jusqu’à obtenir une pâte homogène.\\n6. Verser dans un moule à cake de 20 cm chemisé.\\n7. Cuire 28 à 30 minutes. Laisser refroidir avant de couper en 6 tranches.'}
 ];
 let changed=false;
 for(const recipe of additions){
  const existing=recipes.find(r=>r.sourceId===recipe.sourceId||normalized(r.name)===normalized(recipe.name));
  if(!existing){recipes.push(recipe);changed=true;}
  else{
   existing.sourceId=existing.sourceId||recipe.sourceId;
   if(existing.category!=='Biscuits sans sucre'){existing.category='Biscuits sans sucre';changed=true;}
   if((existing.contentVersion||0)<3){
    existing.ingredients=recipe.ingredients.split(/\\r?\\n/).map(ingredientLineFormat).join('\\n');existing.preparation=recipe.preparation;
    existing.servings=recipe.servings;existing.prepTime=recipe.prepTime;existing.cookTime=recipe.cookTime;
    existing.contentVersion=2;changed=true;
   }
  }
 }
 if(changed)saveLocalCloudData();
 return changed;
}


window.ensureNoAddedSugarRecipes=ensureNoAddedSugarRecipes;
function scaledIngredientLine(line,ratio){
 const s=String(line||'').trim();
 if(/^(rendement|pour|moule)\\s*:/i.test(s))return s;
 const m=s.match(/^(.+?)\\s*:\\s*(.+)$/);
 if(!m)return s;
 const item=m[1].trim(),qty=m[2].trim();
 const num=qty.match(/^([0-9]+(?:[.,][0-9]+)?)(.*)$/);
 if(!num)return s;
 const scaled=Number((Number(num[1].replace(',','.'))*ratio).toFixed(2));
 return item+' : '+scaled.toString().replace('.',',')+num[2];
}
function recipeLinesForServings(r,servings){
 const base=Math.max(1,Number(r.servings)||3),ratio=Math.max(1,Number(servings)||base)/base;
 return String(r.ingredients||'Non renseignés').split(/\\r?\\n/).map(line=>scaledIngredientLine(line,ratio));
}
window.recipeServingsChoice={};
function showRecipe(i){
 const r=recipes[i];if(!r)return;
 const app=document.getElementById('app');
 const servings=Number(window.recipeServingsChoice[i])||Number(r.servings)||3;
 const ingredientList=recipeLinesForServings(r,servings).map(line=>line.trim()).filter(Boolean).map(line=>'<li>'+esc(ingredientLineFormat(line))+'</li>').join('');
 const prepList=String(r.preparation||'Non renseignée').split(/\\r?\\n/).map(line=>line.trim()).filter(Boolean).map(line=>'<li>'+esc(line.replace(/^\\d+[.)]\\s*/,''))+'</li>').join('');
 app.innerHTML='<button class="light" onclick="page(\'recipes\')">← Retour aux recettes</button><div class="card"><h2>'+esc(r.name)+'</h2><span class="pill">'+esc(r.category||'')+'</span><p class="small">Préparation : '+(r.prepTime||0)+' min · Cuisson : '+(r.cookTime||0)+' min</p><label for="recipe-servings">Nombre de personnes / portions</label><input id="recipe-servings" type="number" min="1" max="30" value="'+servings+'" onchange="window.updateRecipeServings('+i+',this.value)"><p class="small">Quantités recalculées automatiquement à partir de la recette originale pour '+servings+' personne(s)/portion(s).</p><h3>Ingrédients</h3><ul id="scaled-ingredients" style="padding-left:22px;line-height:1.8">'+ingredientList+'</ul><h3>Préparation</h3><ol style="padding-left:22px;line-height:1.8">'+prepList+'</ol><p><button onclick="addRecipeIngredients('+i+')">Ajouter les ingrédients pour '+servings+' aux courses</button></p></div>';
}
function updateRecipeServings(i,value){
 const servings=Math.max(1,Math.min(30,Number(value)||1));window.recipeServingsChoice[i]=servings;
 showRecipe(i);
}
window.showRecipe=showRecipe;
window.updateRecipeServings=updateRecipeServings;
window.recipeLinesForServings=recipeLinesForServings;

function page(p){
const app=document.getElementById('app');
if(p==='home'){
const todayPlan=getDayPlan(todayKey());
const lunchToday=todayPlan.lunch?.name||'Aucun repas prévu';
const dinnerToday=todayPlan.dinner?.name||'Aucun repas prévu';
app.innerHTML=`<h2>Que mange-t-on aujourd'hui ?</h2>
<div class="card"><h3>☀️ Déjeuner</h3><p>${esc(lunchToday)}</p></div>
<div class="card"><h3>🌙 Dîner</h3><p>${esc(dinnerToday)}</p></div>
<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Découvrons une recette déjà enregistrée !</p><button onclick="randomRecipe()">Trouver une idée</button><p id="random"></p></div>
<div class="card"><h3>🌿 Notre cuisine</h3><p>${stock.length} produit(s) en stock</p><p>${shopping.length} article(s) dans les courses</p><p>${recipes.length} recette(s) enregistrée(s)</p></div>`;
}
if(p==='stock'){renderStock()}
if(p==='shopping'){
app.innerHTML=`<h2>🛒 Liste de courses</h2>
<div class="card"><h3>Ajouter un article</h3><input id="buy" placeholder="Ex : Pain, lait, œufs"><button onclick="addBuy()">Ajouter</button></div>
<div class="card"><h3>Ma liste</h3>${shopping.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" onchange="checkBuy(${i})" ${x.done?'checked':''}> ${esc(x.name)}</label><button class="light" onclick="removeBuy(${i})">Supprimer</button></div>`).join('')||'<p class="empty">Aucun article pour le moment.</p>'}</div>`;
}
if(p==='recipes'){renderRecipes()}
if(p==='planning'){renderPlanning()}

if(p==='alerts'){
const soon=new Date(Date.now()+3*86400000).toISOString().slice(0,10);
app.innerHTML=`<h2>🔔 Alertes</h2><div class="card"><h3>Produits proches de leur date</h3>${stock.filter(x=>x.expiry&&x.expiry<=soon).map(x=>`<p>⚠️ ${esc(x.name)} — ${esc(x.expiry)}</p>`).join('')||'<p class="empty">Aucune alerte pour le moment.</p>'}<p class="small">Les notifications automatiques seront ajoutées ultérieurement.</p></div>`;
}
if(p==='settings'){
app.innerHTML=`<h2>⚙️ Paramètres</h2><div class="card"><p>🌿 Notre Cuisine</p><p>Application familiale en construction.</p><p class="small">Cette version enregistre les données dans le navigateur utilisé. Elles ne sont pas encore partagées entre vos appareils.</p></div>`;
}
}

function renderStock(){
const app=document.getElementById('app');
const shown=stock.filter(x=>(x.place||'Réfrigérateur')===stockPlace&&x.name.toLowerCase().includes(stockSearch.toLowerCase()));
app.innerHTML=`<h2>🥕 Mon inventaire</h2>
<div class="tabs">${places.map(x=>`<button class="${stockPlace===x?'active':''}" onclick="stockPlace='${x}';renderStock()">${x==='Placard'?'🥫':x==='Réfrigérateur'?'🥛':'❄️'} ${x}</button>`).join('')}</div>

<h3>${stockPlace}</h3>
${shown.map(x=>{let i=stock.indexOf(x);return `<div class="item"><b>${esc(x.name)}</b><br><span class="small">${esc(x.quantity||'Quantité non précisée')} ${x.expiry?'· Date : '+esc(x.expiry):''}</span>
<label class="small">Déplacer vers :</label><select onchange="moveStock(${i},this.value)">${places.map(pl=>`<option ${pl===(x.place||'Réfrigérateur')?'selected':''}>${pl}</option>`).join('')}</select>
<button class="light" onclick="removeStock(${i})">Supprimer</button></div>`}).join('')||'<p class="empty">Aucun produit dans cet espace.</p>'}</div>`;

save('stock',stock);stockSearch='';renderStock();
}
function removeStock(i){stock.splice(i,1);save('stock',stock);renderStock()}
function moveStock(i,place){stock[i].place=place;save('stock',stock);renderStock()}
function addBuy(){let name=document.getElementById('buy').value.trim();if(!name)return;shopping.push({name,done:false});save('shopping',shopping);page('shopping')}
function removeBuy(i){shopping.splice(i,1);save('shopping',shopping);page('shopping')}
function checkBuy(i){shopping[i].done=!shopping[i].done;save('shopping',shopping);page('shopping')}
function renderRecipes(){
 const app=document.getElementById('app');
 const shown=recipes.map((r,i)=>({...r,_index:i})).filter(r=>(recipeCategoryFilter==='Toutes'||r.category===recipeCategoryFilter)&&(window.recipeRegionFilter==='Toutes'||r.region===window.recipeRegionFilter));
 app.innerHTML='<h2>🍲 Nos recettes</h2><div class="card"><details><summary style="color:var(--green);font-weight:700;font-size:18px;cursor:pointer;padding:5px 0">＋ Ajouter une recette</summary><div style="padding-top:14px"><p class="small">Tu peux ajouter tes propres recettes à tout moment. Elles resteront dans votre bibliothèque.</p><label>Lien de la recette (facultatif)</label><input id="recipeUrl" type="url" placeholder="https://…"><button class="light" onclick="openRecipeLink()">Ouvrir le lien</button><label>Nom de la recette</label><input id="rname" placeholder="Ex : Gratin maison"><label>Catégorie</label><select id="category">'+categories.map(c=>'<option>'+c+'</option>').join('')+'</select><label>Région ou origine (facultatif)</label><select id="recipeRegion"><option value="">Aucune région</option>'+[].map(r=>'<option>'+r+'</option>').join('')+'</select><label>Ingrédients (un par ligne)</label><textarea id="ingredients" placeholder="Ex : 200 g de farine"></textarea><label>Préparation</label><textarea id="preparation" placeholder="Étapes de préparation"></textarea><label>Temps de préparation (minutes)</label><input id="prepTime" type="number" min="0" value="15"><label>Temps de cuisson (minutes)</label><input id="cookTime" type="number" min="0" value="30"><label>Nombre de personnes</label><input id="servings" type="number" min="1" value="3"><button onclick="addRecipe()">Enregistrer ma recette</button></div></details></div><div class="card"><h3>📖 Ma bibliothèque</h3><label>Filtrer par catégorie</label><select onchange="recipeCategoryFilter=this.value;renderRecipes()"><option value="Toutes">Toutes les catégories</option>'+categories.map(c=>'<option '+(recipeCategoryFilter===c?'selected':'')+'>'+c+'</option>').join('')+'</select><label>Filtrer par région</label><select onchange="window.recipeRegionFilter=this.value;renderRecipes()"><option value="Toutes">Toutes les régions</option>'+[].map(r=>'<option '+(window.recipeRegionFilter===r?'selected':'')+'>'+r+'</option>').join('')+'</select>'+(shown.length?shown.map(r=>'<div class="item"><b>'+esc(r.name)+'</b> <span class="pill">'+esc(r.category||'')+'</span>'+(r.region?' <span class="pill">'+esc(r.region)+'</span>':'')+'<p class="small">'+esc(r.ingredients||'Ingrédients non renseignés')+'</p><button class="light" onclick="window.showRecipe('+r._index+')">Voir / modifier</button><button class="light" onclick="deleteRecipe('+r._index+')">Supprimer</button></div>').join(''):'<p class="empty">Aucune recette dans cette sélection.</p>')+'</div>';

function openRecipeLink(){
let url=document.getElementById('recipeUrl').value.trim();
if(!url)return alert('Ajoute d’abord le lien de la recette.');
try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();window.open(u.href,'_blank','noopener')}catch(e){alert('Vérifie que le lien commence par https://')}
}
function addRecipe(){
 const name=document.getElementById('rname').value.trim();if(!name)return alert('Ajoute le nom de la recette.');
 let url=document.getElementById('recipeUrl').value.trim();if(url){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();url=u.href}catch(e){return alert('Le lien de la recette ne semble pas valide.')}}
 recipes.push({name,category:document.getElementById('category').value,region:document.getElementById('recipeRegion').value,ingredients:document.getElementById('ingredients').value,preparation:document.getElementById('preparation').value,prepTime:Number(document.getElementById('prepTime').value)||0,cookTime:Number(document.getElementById('cookTime').value)||0,servings:Math.max(1,Number(document.getElementById('servings').value)||3),url});
 save('recipes',recipes);renderRecipes();
}
function deleteRecipe(i){recipes.splice(i,1);save('recipes',recipes);page('recipes')}
// Planning hebdomadaire : chaque repas est associé à une date et à une recette.
let planningWeekOffset=0;
function dateKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function todayKey(){return dateKey(new Date())}
function getDayPlan(key){return plans[key]||{lunch:null,dinner:null}}
function weekStart(offset=0){
 const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d;
}
function formatDay(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function renderPlanning(){
 const app=document.getElementById('app');const start=weekStart(planningWeekOffset);
 const end=new Date(start);end.setDate(end.getDate()+6);
 const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
 app.innerHTML=`<h2>📅 Planning de la semaine</h2>
 <div class="card">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
 <button class="light" onclick="changePlanningWeek(-1)">← Semaine précédente</button>
 <b>${start.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</b>
 <button class="light" onclick="changePlanningWeek(1)">Semaine suivante →</button>
 </div><button class="light" onclick="planningWeekOffset=0;renderPlanning()">Aujourd'hui</button>
 <p class="small">Choisis une recette enregistrée ou saisis un repas libre. Les portions sont réglées à 3 personnes par défaut.</p>
 </div>
 ${days.map(d=>{const key=dateKey(d);const day=getDayPlan(key);return `
 <div class="card">
 <h3 style="text-transform:capitalize">${formatDay(d)}</h3>
 ${renderMealEditor(key,'lunch','☀️ Déjeuner',day.lunch)}
 ${renderMealEditor(key,'dinner','🌙 Dîner',day.dinner)}
 </div>`}).join('')}
 <div class="card"><h3>🛒 Courses de la semaine</h3>
 <p class="small">Les ingrédients des recettes prévues sont regroupés ici. Tu peux les ajouter à ta liste de courses.</p>
 <div id="weeklyIngredients">${weeklyIngredientsHtml(start)}</div>
 <button onclick="addWeeklyIngredients()">Ajouter les ingrédients à ma liste de courses</button>
 </div>`;
}
function renderMealEditor(key,slot,label,meal){
 const recipeOptions=recipes.map((r,i)=>`<option value="${i}" ${meal?.recipeIndex===i?'selected':''}>${esc(r.name)}</option>`).join('');
 const custom=meal?.custom||(!meal?.recipeIndex&&meal?.name&&!recipes.some(r=>r.name===meal.name));
 return `<div class="item"><b>${label}</b>
 <label>Recette enregistrée</label>
 <select id="${key}-${slot}-recipe" onchange="selectPlannedRecipe('${key}','${slot}',this.value)">
 <option value="">Choisir une recette…</option>${recipeOptions}<option value="custom" ${custom?'selected':''}>Autre repas / saisie libre</option>
 </select>
 <div id="${key}-${slot}-custom" ${custom?'':'hidden'}>
 <label>Nom du repas</label><input id="${key}-${slot}-name" value="${esc(custom?meal?.name||'':'')}" placeholder="Ex : Salade composée">
 </div>
 <label>Nombre de personnes</label>
 <input id="${key}-${slot}-servings" type="number" min="1" max="20" value="${meal?.servings||3}">
 <button onclick="savePlannedMeal('${key}','${slot}')">Enregistrer</button>
 ${meal?'<button class="light" onclick="clearPlannedMeal(\''+key+'\',\''+slot+'\')">Supprimer ce repas</button>':''}
 </div>`;
}
function suggestWeekMeals(){
 if(!recipes.length)return alert('Enregistre d’abord quelques recettes.');
 const start=weekStart(planningWeekOffset),used=new Set();
 for(let day=0;day<7;day++){
  const d=new Date(start);d.setDate(d.getDate()+day);const key=dateKey(d);
  const dayPlan=plans[key]||{lunch:null,dinner:null};
  ['lunch','dinner'].forEach(slot=>{
   if(dayPlan[slot]){const old=recipeForMeal(dayPlan[slot]);if(old)used.add(old.name);return}
   let pool=recipes.filter(r=>!used.has(r.name));if(!pool.length)pool=recipes;
   const scores=pool.map(r=>{const lines=(r.ingredients||'').split(/\\r?\\n/).filter(Boolean);const matched=lines.filter(line=>inventoryHas(ingredientParts(line).name)).length;return {r,score:lines.length?matched/lines.length:0}});
   scores.sort((a,b)=>b.score-a.score);const top=scores.filter(x=>x.score===scores[0].score);
   const chosen=top[Math.floor(Math.random()*top.length)].r;
   used.add(chosen.name);dayPlan[slot]={name:chosen.name,recipeIndex:recipes.indexOf(chosen),ingredients:chosen.ingredients||'',recipeServings:Number(chosen.servings)||3,servings:Number(get('defaultPeople',3))||3};
  });
  plans[key]=dayPlan;
 }
 save('plans',plans);renderPlanning();
}
function changePlanningWeek(delta){planningWeekOffset+=delta;renderPlanning()}
function selectPlannedRecipe(key,slot,value){
 const custom=document.getElementById(key+'-'+slot+'-custom');
 if(custom)custom.hidden=value!=='custom';
 if(value!=='custom'&&value!==''){
  const recipe=recipes[Number(value)];
  const servings=document.getElementById(key+'-'+slot+'-servings');
  if(servings&&recipe?.servings)servings.value=3;
 }
}
function savePlannedMeal(key,slot){
 const select=document.getElementById(key+'-'+slot+'-recipe');
 const servings=Math.max(1,Number(document.getElementById(key+'-'+slot+'-servings').value)||3);
 let meal=null;
 if(select.value==='custom'){
  const name=document.getElementById(key+'-'+slot+'-name').value.trim();
  if(!name)return alert('Indique le nom du repas.');
  meal={name,custom:true,servings};
 }else if(select.value!==''){
  const index=Number(select.value);const recipe=recipes[index];
  if(!recipe)return alert('Cette recette n’existe plus.');
  meal={name:recipe.name,recipeIndex:index,ingredients:recipe.ingredients||'',recipeServings:Number(recipe.servings)||3,servings};
 }else{
  return alert('Choisis une recette ou sélectionne « Autre repas ».');
 }
 if(!plans[key]||!plans[key].lunch&&!plans[key].dinner)plans[key]={lunch:null,dinner:null};
 plans[key][slot]=meal;save('plans',plans);renderPlanning();
}
function clearPlannedMeal(key,slot){if(plans[key]){plans[key][slot]=null;save('plans',plans)}renderPlanning()}
function weeklyMeals(start){
 const out=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const day=getDayPlan(dateKey(d));['lunch','dinner'].forEach(slot=>{if(day[slot]?.ingredients)out.push({name:day[slot].name,ingredients:day[slot].ingredients,servings:day[slot].servings||3,recipeServings:day[slot].recipeServings||3})})}return out;
}
function weeklyIngredientLines(start){
 const lines=[];weeklyMeals(start).forEach(meal=>meal.ingredients.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).forEach(item=>lines.push(item)));
 return [...new Set(lines)];
}
function weeklyIngredientsHtml(start){
 const lines=weeklyIngredientLines(start);return lines.length?'<ul>'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">Ajoute des recettes au planning pour voir les ingrédients nécessaires.</p>';
}
function addWeeklyIngredients(){
 const lines=weeklyIngredientLines(weekStart(planningWeekOffset));let added=0;
 lines.forEach(name=>{if(!shopping.some(x=>x.name.toLowerCase()===name.toLowerCase()&&!x.done)){shopping.push({name,done:false});added++}});
 save('shopping',shopping);alert(added+' ingrédient(s) ajouté(s) à la liste de courses.');page('shopping');
}
function randomRecipe(){let r=recipes.length?recipes[Math.floor(Math.random()*recipes.length)].name:'Ajoute d’abord quelques recettes !';document.getElementById('random').textContent=r}
page('home');
</script>

<script>
/* Fonctions enrichies de Notre Cuisine. Les données existantes restent conservées dans ce navigateur. */
let recipeSearchText='',showFavoritesOnly=false,editingRecipe=-1;
function normalized(s){return String(s||'').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function todayPlanData(){return getDayPlan(todayKey())}
function recipeForMeal(meal){if(!meal)return null;if(Number.isInteger(meal.recipeIndex))return recipes[meal.recipeIndex]||null;return recipes.find(r=>r.name===meal.name)||null}
function page(p){

 if(p==='home'){
  const day=todayPlanData(),l=day.lunch,d=day.dinner;
  const near=stock.filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+3*86400000).toISOString().slice(0,10));
  app.innerHTML='<h2>Que mange-t-on aujourd’hui ?</h2>'+
   '<div class="card"><h3>☀️ Déjeuner</h3><b>'+esc(l?.name||'Aucun repas prévu')+'</b><p><button class="light" onclick="page(\'planning\')">Voir le planning</button></p></div>'+
   '<div class="card"><h3>🌙 Dîner</h3><b>'+esc(d?.name||'Aucun repas prévu')+'</b><p><button class="light" onclick="page(\'planning\')">Voir le planning</button></p></div>'+
   '<div class="card"><h3>✨ Une idée au hasard ?</h3><p>Une recette de votre bibliothèque, en tenant compte des produits disponibles.</p><button onclick="randomRecipe()">Trouver une idée</button><div id="random"></div></div>'+
   '<div class="recipe-grid">'+
   '<div class="card" onclick="page(\'stock\')">🥕 <b>Inventaire</b><p class="mini">'+stock.length+' produit(s)</p></div>'+
   '<div class="card" onclick="page(\'shopping\')">🛒 <b>Courses</b><p class="mini">'+shopping.filter(x=>!x.done).length+' article(s) à acheter</p></div>'+
   '<div class="card" onclick="page(\'recipes\')">🍲 <b>Recettes</b><p class="mini">'+recipes.length+' recette(s)</p></div>'+
   '<div class="card" onclick="page(\'planning\')">📅 <b>Planning</b><p class="mini">Organiser la semaine</p></div></div>'+
   '<div class="card"><h3>🔔 À ne pas oublier</h3><p>'+near.length+' produit(s) à consommer rapidement.</p><button class="light" onclick="page(\'alerts\')">Voir mes alertes</button></div>';
 }
 if(p==='stock')renderStock();
 if(p==='shopping')renderShopping();
 if(p==='recipes')renderRecipes();
 if(p==='planning')renderPlanning();
 if(p==='alerts'){
  const today=todayKey(),soon=new Date(Date.now()+3*86400000).toISOString().slice(0,10);
  const expired=stock.filter(x=>x.expiry&&x.expiry<today),close=stock.filter(x=>x.expiry&&x.expiry>=today&&x.expiry<=soon);
  app.innerHTML='<h2>🔔 Alertes</h2><div class="card"><h3>🚨 Dates dépassées</h3>'+
   (expired.map(x=>'<div class="item">'+esc(x.name)+' — '+esc(x.expiry)+'</div>').join('')||'<p class="empty">Aucun produit périmé renseigné.</p>')+
   '</div><div class="card"><h3>⏰ À consommer dans les 3 jours</h3>'+
   (close.map(x=>'<div class="item">'+esc(x.name)+' — '+esc(x.expiry)+'</div>').join('')||'<p class="empty">Aucune date proche.</p>')+
   '<p class="small">Les alertes s’affichent dans l’application. Les notifications push seront possibles après la mise en place d’un service en ligne.</p></div>';
 }
 if(p==='settings'){
  app.innerHTML='<h2>⚙️ Paramètres</h2><div class="card"><h3>🌿 Notre Cuisine</h3><p>Application familiale en construction.</p><p class="small">Pour le moment, les données sont enregistrées dans ce navigateur uniquement. La création des comptes et la synchronisation entre vos deux téléphones seront ajoutées avec Supabase.</p><h3>👨‍👩‍👦 Foyer</h3><label>Nombre de personnes par défaut</label><input id="defaultPeople" type="number" min="1" max="20" value="'+(get('defaultPeople',3))+'"><button onclick="saveDefaultPeople()">Enregistrer</button><p class="small">Le planning utilise 3 personnes par défaut, modifiables pour chaque repas.</p></div>';
 }
}
function saveDefaultPeople(){const n=Math.max(1,Number(document.getElementById('defaultPeople').value)||3);save('defaultPeople',n);alert('Nombre de personnes enregistré.');}
function renderStock(){
 const app=document.getElementById('app');
 const shown=stock.filter(x=>(x.place||'Réfrigérateur')===stockPlace&&x.name.toLowerCase().includes(stockSearch.toLowerCase()));
 app.innerHTML='<h2>🥕 Mon inventaire</h2><div class="tabs">'+places.map(x=>'<button class="'+(stockPlace===x?'active':'light')+'" onclick="stockPlace=\''+x+'\';renderStock()">'+(x==='Placard'?'🥫':x==='Réfrigérateur'?'🥛':'❄️')+' '+x+'</button>').join('')+'</div>'+
 '<div class="card"><h3>Ajouter un aliment</h3><label>Nom du produit</label><input id="product" placeholder="Ex : Pâtes, lait, poulet…"><label>Quantité / conditionnement</label><input id="quantity" placeholder="Ex : 2 paquets, 500 g, pack de 6"><label>Date limite (facultatif)</label><input id="expiry" type="date"><label>Code-barres (facultatif)</label><div style="display:flex;gap:6px"><input id="barcode" placeholder="Code-barres" style="flex:1"><button class="light" onclick="scanBarcode()">📷 Scanner</button></div><video id="barcodeVideo" playsinline hidden style="width:100%;border-radius:12px"></video><button onclick="addStock()">Ajouter dans '+stockPlace.toLowerCase()+'</button><p class="mini">Le scan lit le code. Le nom du produit reste à saisir pour le moment.</p></div>'+
 '<div class="card"><h3>📄 Importer mes achats (facture PDF)</h3><p class="small">Sélectionne une facture PDF Auchan Drive. Les produits seront préremplis pour vérification avant ajout. Aucun prix n’est conservé.</p><input id="purchasePdf" type="file" accept="application/pdf"><button onclick="readPurchasePdf()">Lire la facture PDF</button><p id="purchasePdfStatus" class="small" role="status"></p><div id="purchasePdfPreview"></div></div>'+
  '<div class="card"><h3>🔎 Rechercher</h3><input value="'+esc(stockSearch)+'" placeholder="Rechercher un aliment…" oninput="stockSearch=this.value;renderStockKeepFocus(this.value)" id="stockSearch"><h3>'+stockPlace+'</h3>'+
 (shown.map(x=>{let i=stock.indexOf(x);return '<div class="item"><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.quantity||'Quantité non précisée')+(x.expiry?' · Date : '+esc(x.expiry):'')+(x.barcode?' · Code : '+esc(x.barcode):'')+'</span><label class="small">Déplacer vers :</label><select onchange="moveStock('+i+',this.value)">'+places.map(pl=>'<option '+(pl===(x.place||'Réfrigérateur')?'selected':'')+'>'+pl+'</option>').join('')+'</select><button class="light" onclick="consumeStock('+i+')">Produit terminé</button><button class="light" onclick="removeStock('+i+')">Supprimer</button></div>'}).join('')||'<p class="empty">Aucun produit dans cet espace.</p>')+'</div>';

async function scanBarcode(){

function stockIngredientName(line){
 let value=String(line||'').replace(/^\s*[-•]\s*/,'').trim();
 value=value.replace(/^\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?\s*(?:kg|g|grammes?|mg|l|litres?|cl|centilitres?|ml|millilitres?|pieces?|pce|pcs|tranches?|cuilleres?\s+a\s+soupe|cuilleres?\s+a\s+cafe)?\s*(?:de|d['’])?\s*/i,'');
 return normalized(value).replace(/s$/,'');
}
function stockHasRecipeIngredient(line){
 const wanted=stockIngredientName(line);
 if(!wanted)return false;
 return stock.some(item=>{
  const have=normalized(item.name).replace(/s$/,'');
  return have===wanted||have.includes(wanted)||wanted.includes(have);
 });
}
function findRecipesFromStock(){
 const results=document.getElementById('stockRecipeResults');
 if(!results)return;
 if(!stock.length){results.innerHTML='<p class="empty">Ton inventaire est vide. Ajoute d’abord des aliments dans les placards, le réfrigérateur ou le congélateur.</p>';return;}
 const ranked=recipes.map((r,i)=>{
  const lines=String(r.ingredients||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const missing=lines.filter(line=>!stockHasRecipeIngredient(line));
  return {r,i,total:lines.length,missing,available:lines.length-missing.length};
 }).filter(x=>x.total>0).sort((a,b)=>(a.missing.length-b.missing.length)||(b.available-a.available));
 if(!ranked.length){results.innerHTML='<p class="empty">Ajoute les ingrédients dans tes fiches recettes pour que je puisse les comparer à ton inventaire.</p>';return;}
 results.innerHTML='<h3>🍽️ Recettes possibles avec tes réserves</h3><p class="mini">Comparaison avec les produits enregistrés dans les trois espaces. Les quantités disponibles ne sont pas déduites automatiquement.</p>'+ranked.map(x=>'<div class="item"><b>'+esc(x.r.name)+'</b> <span class="pill">'+(x.missing.length?'Il manque '+x.missing.length:'Tout est en stock')+'</span><p class="mini">'+x.available+' ingrédient(s) repéré(s) sur '+x.total+'</p>'+(x.missing.length?'<p class="mini">À prévoir : '+x.missing.map(esc).join(', ')+'</p>':'<p class="mini">Tu as tous les ingrédients indiqués dans ton inventaire.</p>')+'<button class="light" onclick="window.showRecipe('+x.i+')">Voir la recette</button></div>').join('');
}

function openRecipeLink(){

async function importRecipeFromUrl(){
 const url=document.getElementById('recipeUrl').value.trim();
 const status=document.getElementById('recipeImportStatus');
 if(!url){status.textContent='Colle d’abord le lien de la recette.';return}
 try{
  const parsed=new URL(url);
  if(!['http:','https:'].includes(parsed.protocol))throw new Error('Le lien doit commencer par https://');
 }catch(e){status.textContent=e.message||'Le lien n’est pas valide.';return}
 const button=document.querySelector('button[onclick="importRecipeFromUrl()"]');
 if(button){button.disabled=true;button.textContent='Importation en cours…'}
 status.textContent='Lecture de la recette depuis le site…';
 try{
  const {data,error}=await supabaseClient.functions.invoke('import-recipe',{body:{url}});
  if(error)throw new Error(error.message||'La fonction Supabase n’a pas répondu.');
  if(!data||!data.success||!data.recipe)throw new Error(data?.error||'Aucune recette exploitable trouvée.');
  const r=data.recipe;
  if(r.name)document.getElementById('rname').value=r.name;
  if(Array.isArray(r.ingredients))document.getElementById('ingredients').value=r.ingredients.join('\n');
  if(r.preparation)document.getElementById('preparation').value=r.preparation;
  if(r.image)document.getElementById('rphoto').value=r.image;
  if(Number(r.prepTime))document.getElementById('prepTime').value=Number(r.prepTime);
  if(Number(r.cookTime))document.getElementById('cookTime').value=Number(r.cookTime);
  const servings=String(r.servings||'').match(/\d+/);
  if(servings)document.getElementById('servings').value=servings[0];
  document.getElementById('recipeUrl').value=r.sourceUrl||url;
  status.textContent='Recette importée ! Vérifie les quantités, les étapes et la catégorie, puis clique sur « Enregistrer dans mes recettes ».';
 }catch(e){
  status.textContent='Importation impossible : '+(e.message||'Erreur inconnue')+'. Certains sites bloquent la lecture automatique.';
 }finally{
  if(button){button.disabled=false;button.textContent='📥 Importer automatiquement depuis ce lien'}
 }
}

function fillRecipeFromPaste(){
 const text=document.getElementById('recipePaste').value.trim();
 const status=document.getElementById('recipeImportStatus');
 if(!text){status.textContent='Colle d’abord le texte de la recette.';return}
 const lines=text.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);
 const heading=(s)=>/^(ingrédients?|ingredients?|préparation|preparation|instructions?|étapes?|etapes?|directions?|méthode|methode|pour .*|cuisson)$/i.test(s);
 let ingredientStart=lines.findIndex(x=>/^ingrédients?\\s*:?”?$/i.test(x)||/^ingredients?\\s*:?”?$/i.test(x));
 let prepStart=lines.findIndex(x=>/^(préparation|preparation|instructions?|étapes?|etapes?|directions?|méthode|methode)\\s*:?.*$/i.test(x));
 let name=document.getElementById('rname');
 if(!name.value&&lines.length)name.value=lines[0].slice(0,100);
 let ingredients='',preparation='';
 if(ingredientStart>=0){
  const stop=prepStart>ingredientStart?prepStart:lines.length;
  ingredients=lines.slice(ingredientStart+1,stop).filter(x=>!heading(x)).join('\\n');
 }else{
  const cutoff=prepStart>=0?prepStart:Math.max(1,Math.ceil(lines.length/2));
  ingredients=lines.slice(1,cutoff).join('\\n');
 }
 if(prepStart>=0)preparation=lines.slice(prepStart+1).filter(x=>!/^bon appétit|bonne dégustation/i.test(x)).join('\\n');
 else if(ingredientStart>=0)preparation=lines.slice(ingredientStart+1).filter(x=>!heading(x)).join('\\n');
 if(ingredients)document.getElementById('ingredients').value=ingredients;
 if(preparation)document.getElementById('preparation').value=preparation;
 status.textContent='Fiche pré-remplie avec le texte collé. Vérifie bien les ingrédients et les étapes avant d’enregistrer.';
}

 const url=document.getElementById('recipeUrl').value.trim(),photo=document.getElementById('rphoto').value.trim();
 for(const link of [url,photo])if(link){try{const u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw 0}catch(e){return alert('Vérifie les liens saisis. Ils doivent commencer par https://')}}
 const r={name,category:document.getElementById('category').value,ingredients:document.getElementById('ingredients').value,preparation:document.getElementById('preparation').value,servings:Math.max(1,Number(document.getElementById('servings').value)||3),url,photo,favorite:false};

function ingredientParts(line){
 const m=String(line).trim().match(/^([0-9]+(?:[.,][0-9]+)?(?:\s*\/\s*[0-9]+)?)\s*(kg|g|mg|l|cl|ml|piece|pieces|pce|pcs)?\s*(?:de|d’|d')?\s*(.+)$/i);
 if(!m)return {name:String(line).trim(),amount:null,unit:''};
 let amount=m[1].includes('/')?m[1].split('/').reduce((a,b)=>a/Number(b),Number(m[1].split('/')[0])):Number(m[1].replace(',','.'));
 return {name:m[3].trim(),amount,unit:(m[2]||'').toLowerCase()};
}
function plannedIngredientNeeds(start){
 const needs={};
 for(let day=0;day<7;day++){const d=new Date(start);d.setDate(d.getDate()+day);const plan=getDayPlan(dateKey(d));
 ['lunch','dinner'].forEach(slot=>{const meal=plan[slot];if(!meal?.ingredients)return;
  const ratio=(Number(meal.servings)||3)/(Number(meal.recipeServings)||3);
  meal.ingredients.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
   const p=ingredientParts(line),key=normalized(p.name);if(!key)return;

   if(p.amount!==null&&(!needs[key].unit||needs[key].unit===p.unit)){needs[key].amount+=p.amount*ratio;needs[key].hasAmount=true}

function unitBase(unit){
 const u=(unit||'').toLowerCase();
 if(u==='kg')return {type:'mass',factor:1000,unit:'g'};
 if(u==='g')return {type:'mass',factor:1,unit:'g'};
 if(u==='mg')return {type:'mass',factor:.001,unit:'g'};
 if(u==='l')return {type:'volume',factor:1000,unit:'ml'};
 if(u==='cl')return {type:'volume',factor:10,unit:'ml'};
 if(u==='ml')return {type:'volume',factor:1,unit:'ml'};
 if(['piece','pieces','pce','pcs'].includes(u))return {type:'count',factor:1,unit:'piece'};
 return null;
}
function parsedStockQuantity(value){
 const m=String(value||'').match(/([0-9]+(?:[.,][0-9]+)?)\s*(kg|g|mg|l|cl|ml|pieces?|pce|pcs)\b/i);
 if(!m)return null;const base=unitBase(m[2]);if(!base)return null;
 return {amount:Number(m[1].replace(',','.'))*base.factor,type:base.type,unit:base.unit};
}
function missingIngredients(start){
 return plannedIngredientNeeds(start).map(need=>{
  const target=unitBase(need.unit);if(!target||!need.hasAmount)return need;
  let available=0,unknown=false;
  stock.filter(s=>{const sn=normalized(s.name),n=normalized(need.name);return sn===n||sn.includes(n)||n.includes(sn)}).forEach(s=>{
   const q=parsedStockQuantity(s.quantity);
   if(!q)unknown=true;else if(q.type===target.type)available+=q.amount;
  });
  if(unknown)return null;
  const remaining=need.amount-available/target.factor;
  return remaining>0?{...need,amount:remaining}:null;
 }).filter(Boolean);
}

let parsedPurchaseItems=[];
async function ensurePdfJs(){
 if(window.pdfjsLib)return window.pdfjsLib;
 await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Chargement du lecteur PDF impossible.'));document.head.appendChild(s);});
 window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 return window.pdfjsLib;
}
function parseAuchanInvoiceText(text){
 const lines=String(text||'').split(/\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean),out=[];
 for(const line of lines){
  // Les factures Drive affichent généralement : code-barres, libellé,
  // prix unitaire, remise, quantité, net HT, TVA, cagnotte éventuelle, TTC.
  // On n'enregistre jamais les prix : seule la quantité est extraite.
  const m=line.match(/^(\d{13})\s+(.+?)\s+((?:\d+[.,]\d{2}|\d+)\s*){3,}$/);
  if(!m)continue;
  const barcode=m[1],name=m[2].trim();
  const tail=line.slice(m[0].indexOf(name)+name.length).trim();
  const tokens=tail.match(/\d+[.,]\d{2}|\d+/g)||[];
  if(!name||out.some(x=>x.barcode===barcode)||tokens.length<3)continue;
  // Exemple utilisateur : 4,28 1 4,28 5,50 4,52 -> quantité = 1 (2e token).
  // Si le format diffère, on retient une quantité entière plausible au 2e token.
  const qtyToken=tokens[1];
  const qty=Number(String(qtyToken).replace(',','.'));
  if(!Number.isFinite(qty)||qty<=0||qty>1000)continue;
  out.push({barcode,name,qty,pack:extractPack(name),checked:true});
 }
 return out;
}
function extractPack(name){const m=String(name).match(/\b(\d+(?:[.,]\d+)?\s?(?:kg|g|l|cl|ml|pcs?|pièces?|bouteilles?))\b/i);return m?m[1].replace(',','.'):''}
async function readPurchasePdf(){
 const file=document.getElementById('purchasePdf')?.files?.[0],status=document.getElementById('purchasePdfStatus'),preview=document.getElementById('purchasePdfPreview');
 if(!file){status.textContent='Sélectionne d’abord ta facture PDF.';return}
 status.textContent='Lecture du PDF…';preview.innerHTML='';
 try{
  const pdfjs=await ensurePdfJs();const bytes=await file.arrayBuffer();const doc=await pdfjs.getDocument({data:bytes}).promise;let text='';
  for(let p=1;p<=doc.numPages;p++){
   const page=await doc.getPage(p),content=await page.getTextContent();
   // Regrouper les cellules du tableau par ligne visuelle, puis de gauche à droite.
   const rows=[];
   for(const item of content.items){
    const value=String(item.str||'').trim();
    if(!value)continue;
    const x=Number(item.transform?.[4]||0),y=Number(item.transform?.[5]||0);
    let row=rows.find(r=>Math.abs(r.y-y)<=2.5);
    if(!row){row={y,items:[]};rows.push(row);}
    row.items.push({x,value});
   }
   rows.sort((a,b)=>b.y-a.y);
   text+=rows.map(row=>row.items.sort((a,b)=>a.x-b.x).map(item=>item.value).join(' ')).join('\n')+'\n';
  }
  parsedPurchaseItems=parseAuchanInvoiceText(text);
  if(!parsedPurchaseItems.length){status.textContent='Aucun article reconnu automatiquement. Essaie un PDF texte (non scanné) ou copie-colle le détail de facture dans un futur import.';return}
  status.textContent=parsedPurchaseItems.length+' article(s) détecté(s). Vérifie la sélection avant ajout.';
  preview.innerHTML='<h4>Articles détectés (prix exclus)</h4>'+parsedPurchaseItems.map((x,i)=>'<div class="item"><label><input type="checkbox" style="width:auto" '+(x.checked?'checked':'')+' onchange="parsedPurchaseItems['+i+'].checked=this.checked"> '+esc(x.name)+'</label><p class="small">Code-barres : '+esc(x.barcode)+' · '+(x.pack?'Format : '+esc(x.pack)+' · ':'')+'Quantité achetée : <input style="max-width:90px;display:inline-block" type="number" min="1" value="'+x.qty+'" onchange="parsedPurchaseItems['+i+'].qty=Math.max(1,Number(this.value)||1)"></p></div>').join('')+'<button onclick="confirmPurchaseImport()">Ajouter les articles sélectionnés au stock</button>';
 }catch(e){status.textContent='Lecture impossible : '+(e.message||'Erreur PDF');}
}
function normalizePurchaseName(n){return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function guessStockPlace(name){const n=normalizePurchaseName(name);if(/glace|surgel|congele/.test(n))return 'Congélateur';if(/lait|fromage|emmental|jambon|viande|poulet|creme|yaourt|oeuf|beurre|charcut|saumon/.test(n))return 'Réfrigérateur';return 'Placard'}
function confirmPurchaseImport(){
 const chosen=parsedPurchaseItems.filter(x=>x.checked&&x.qty>0);if(!chosen.length)return alert('Sélectionne au moins un article.');
 let added=0,merged=0;
 chosen.forEach(x=>{
  const existing=stock.find(s=>(x.barcode&&s.barcode===x.barcode)||normalizePurchaseName(s.name)===normalizePurchaseName(x.name));
  const qText=x.pack?x.qty+' × '+x.pack:String(x.qty)+' unité(s)';
  if(existing){existing.barcode=existing.barcode||x.barcode;existing.quantity=mergePurchaseQuantity(existing.quantity,x.qty,x.pack);merged++}
  else stock.push({name:x.name,barcode:x.barcode,place:guessStockPlace(x.name),quantity:qText,expiry:''});
  added++;
 });
 save('stock',stock);stockSearch='';renderStock();alert(added+' article(s) ajouté(s) au stock ('+merged+' fusionné(s) avec un produit existant).');
}
function mergePurchaseQuantity(oldValue,qty,pack){
 const old=String(oldValue||'').trim();const m=old.match(/^(\d+)\s*(?:×|x)?\s*(.*)$/i);
 if(m&&(!pack||!m[2]||normalizePurchaseName(m[2])===normalizePurchaseName(pack)))return (Number(m[1])+qty)+' × '+(pack||m[2]||'unité(s)');
 return old+' + '+(pack?qty+' × '+pack:qty+' unité(s)');
}
</script>

<script>
const SUPABASE_URL = 'https://aoxvtdjezydcpcsbunzg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_fFfcZg2HMDVhg48QO0e5YQ_vMYxS_EP';
const supabaseClient = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
window.cloudReady = false;
let householdId = null;
let cloudSaveTimer = null;

function showAuthMessage(message, isError=false){
  const el=document.getElementById('auth-message');
  if(el){el.textContent=message;el.style.color=isError?'#a33':'#596344';}
}
async function loginToApp(){
  if(!supabaseClient){showAuthMessage('Le service de connexion ne se charge pas. Vérifie ta connexion Internet puis actualise la page.',true);return;}
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  if(!email||!password){showAuthMessage('Renseigne ton adresse e-mail et ton mot de passe.',true);return;}
  const button=document.getElementById('auth-login');
  button.disabled=true;button.textContent='Connexion…';showAuthMessage('');
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  button.disabled=false;button.textContent='Se connecter';
  if(error){showAuthMessage('Connexion impossible : vérifie ton e-mail et ton mot de passe.',true);return;}
  await initializeCloudApp();
}
async function cloudTimeout(promise,label){
  return await Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' prend trop de temps. Vérifie la connexion puis réessaie.')),15000))]);
}
async function initializeCloudApp(){
  showAuthMessage('Chargement de votre cuisine…');
  try{
    const {data:{user},error:authError}=await cloudTimeout(supabaseClient.auth.getUser(),'La vérification du compte');
    if(authError||!user){document.body.classList.remove('connected');showAuthMessage('Session expirée. Recharge la page et reconnecte-toi.',true);return;}
    const {data:membership,error:memberError}=await cloudTimeout(supabaseClient
      .from('household_members').select('household_id').eq('user_id',user.id).single(),'Le chargement du foyer');
    if(memberError||!membership){
      showAuthMessage('Compte non rattaché au foyer. Ne supprime rien et contacte-nous.',true);
      return;
    }
    householdId=membership.household_id;
    const {data:cloudRow,error:loadError}=await cloudTimeout(supabaseClient
      .from('app_data').select('data').eq('household_id',householdId).maybeSingle(),'Le chargement des données');
    if(loadError){showAuthMessage('Impossible de charger les données : '+loadError.message,true);return;}
    if(cloudRow&&cloudRow.data){
      const d=cloudRow.data;
      stock=Array.isArray(d.stock)?d.stock:[];
      shopping=Array.isArray(d.shopping)?d.shopping:[];
      recipes=Array.isArray(d.recipes)?d.recipes:[];
      plans=d.plans&&typeof d.plans==='object'?d.plans:{};
      if(d.defaultPeople)localStorage.setItem('defaultPeople',JSON.stringify(d.defaultPeople));
      saveLocalCloudData();
    }else{
      await writeCloudData();
    }
    const recipeCountBeforeCleanup=recipes.length;
    recipes=recipes.filter(r=>!r.regionalCollection);
    const addedNoSugarRecipes=typeof window.ensureNoAddedSugarRecipes==='function'?window.ensureNoAddedSugarRecipes():false;
    saveLocalCloudData();
    window.cloudReady=true;
    if(recipes.length!==recipeCountBeforeCleanup||addedNoSugarRecipes) await writeCloudData();
    document.body.classList.add('connected');
    document.getElementById('auth-screen').style.display='none';
    page('home');
    showAuthMessage('');
    const header=document.querySelector('header p');
    if(header)header.textContent='Connecté · Cuisine partagée';
    const old=document.getElementById('logout-button');
    if(!old){
      const b=document.createElement('button');b.id='logout-button';b.className='light';b.textContent='Se déconnecter';b.onclick=logoutFromApp;
      document.querySelector('header').appendChild(b);
    }
  }catch(e){
    console.error('Erreur chargement Notre Cuisine:',e);
    document.body.classList.remove('connected');
    showAuthMessage(e.message||'Chargement impossible. Vérifie ta connexion et réessaie.',true);
  }
}
function saveLocalCloudData(){
  localStorage.setItem('stock',JSON.stringify(stock));
  localStorage.setItem('shopping',JSON.stringify(shopping));
  localStorage.setItem('recipes',JSON.stringify(recipes));
  localStorage.setItem('plans',JSON.stringify(plans));
}
function currentCloudData(){
  return {stock,shopping,recipes,plans,defaultPeople:Number(get('defaultPeople',3))||3};
}
async function writeCloudData(){
  if(!householdId)return;
  const {error}=await supabaseClient.from('app_data').upsert({
    household_id:householdId,data:currentCloudData(),updated_at:new Date().toISOString()
  },{onConflict:'household_id'});
  if(error)console.error('Erreur de synchronisation Notre Cuisine:',error.message);
}
function scheduleCloudSave(){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>writeCloudData(),700);
}
async function logoutFromApp(){
  window.cloudReady=false;householdId=null;
  await supabaseClient.auth.signOut();
  document.body.classList.remove('connected');
  const b=document.getElementById('logout-button');if(b)b.remove();
  const header=document.querySelector('header p');if(header)header.textContent='La cuisine de toute la famille';
  showAuthMessage('Tu es déconnectée.');
}
if(supabaseClient){
  supabaseClient.auth.getSession().then(({data})=>{
    if(data.session)initializeCloudApp();
  }).catch(e=>showAuthMessage('Impossible de vérifier la connexion : '+(e.message||e),true));
}else{
  showAuthMessage('Le service de connexion ne se charge pas. Actualise la page pour réessayer.',true);
}
</script>


<script>
/* Gestion de connexion de secours avec affichage explicite des erreurs */
window.loginToApp = async function(){
  const button=document.getElementById('auth-login');
  const message=document.getElementById('auth-message');
  const show=(t)=>{if(message){message.textContent=t;message.style.color='#a33';}};
  try{
    if(typeof supabaseClient==='undefined'||!supabaseClient){
      show('Le service de connexion ne s’est pas chargé. Ferme puis rouvre la page.');
      return;
    }
    const email=document.getElementById('auth-email')?.value.trim();
    const password=document.getElementById('auth-password')?.value;
    if(!email||!password){show('Renseigne ton adresse e-mail et ton mot de passe.');return;}
    if(button){button.disabled=true;button.textContent='Connexion…';}
    if(message)message.textContent='Connexion en cours…';
    const result=await supabaseClient.auth.signInWithPassword({email,password});
    if(result.error)throw result.error;
    await initializeCloudApp();
  }catch(e){
    console.error('Connexion Notre Cuisine:',e);
    show('La connexion a échoué : '+(e?.message||String(e)));
  }finally{
    if(button){button.disabled=false;button.textContent='Se connecter';}
  }
};
</script>
